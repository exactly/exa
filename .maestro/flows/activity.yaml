appId: ${APP_ID ?? "app.exactly"}
env:
  method: ${method ?? "webauthn"}
---
- runFlow: ../subflows/launch.yaml
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: USDC, to: "${output.account}", amount: "20" }
- runScript: { file: ../dist/mint.js, env: { asset: ETH, to: "${output.account}", amount: "0.04" } }
- runFlow: ../subflows/verifyIdentity.yaml
- runScript: { file: ../dist/mint.js, env: { asset: USDC, to: "${output.account}", amount: "25", network: Anvil2 } }
- tapOn: Card
- tapOn: Card details
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Accept and enable card } }
- tapOn: Accept and enable card
- tapOn: Close
- evalScript: ${output.deadline = Date.now() + 60000; output.deposited = undefined}
- repeat:
    while: { true: "${output.deposited !== 25 && Date.now() < output.deadline}" }
    commands: [{ runScript: { file: ../dist/deposited.js, env: { account: "${output.account}", network: Anvil2 } } }]
- assertTrue: ${output.deposited === 25}
- runScript:
    file: ../dist/purchase.js
    env: { merchant: Bakery, amount: "32.10", mode: "0", credentialId: "${output.credential}", account: "${output.account}" }
- runScript:
    file: ../dist/purchase.js
    env: { merchant: Electronics, amount: "56.78", mode: "0", declinedReason: invalid pin, credentialId: "${output.credential}" }
- tapOn: Home
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Later in 1, center: true } }
- tapOn: Later in 1
- tapOn: { text: Close, below: How installment repayment works }
- assertVisible: 1 installment selected
- runScript:
    file: ../dist/purchase.js
    env: { merchant: Bookstore, amount: "23.45", mode: "1", credentialId: "${output.credential}" }
- tapOn: Tap here to change the number of installments
- tapOn: { text: "3", below: Set installments }
- assertVisible: 3 installments selected
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Close } }
- runScript:
    file: ../dist/purchase.js
    env: { merchant: Furniture, amount: "34.56", mode: "3", credentialId: "${output.credential}" }
- runScript: { file: ../dist/liquidate.js, env: { account: "${output.account}" } }
- tapOn: Activity
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Bakery, center: true } }
- tapOn: Bakery
- assertVisible: Paid
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Payment failed, center: true } }
- tapOn: Payment failed
- assertVisible: Failed
- assertVisible: 'There was an error when processing your payment: invalid pin'
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- tapOn: Bookstore
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Installments } }
- assertVisible: { text: '1x\xa0', rightOf: Installments }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- tapOn: Furniture
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Installments } }
- assertVisible: { text: '3x\xa0', rightOf: Installments }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- tapOn: Liquidation
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Collateral seized } }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: USDC 20\.00, center: true } }
- tapOn: USDC 20\.00
- assertVisible: '20[\s\xa0]USDC'
- assertVisible: Transaction details
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- runScript:
    file: ../dist/purchase.js
    env: { merchant: Coffee, amount: "4.50", mode: "3", declinedReason: insufficient funds, count: "50", credentialId: "${output.credential}" }
- tapOn: Activity
- repeat: { times: 8, commands: [{ swipe: { start: "50%,70%", end: "50%,10%" } }] }
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Bakery, center: true } }
- tapOn: Bakery
- assertVisible: Paid
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- repeat: { times: 2, commands: [{ tapOn: Home }] }
- runFlow: ../subflows/storeCoverage.yaml
