appId: ${APP_ID ?? "app.exactly"}
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/assertNotifications.yaml
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: USDC, to: "${output.account}", amount: "420" }
- runFlow: ../subflows/onboarding.yaml
- assertTrue: '${http.post("http://localhost:3000/e2e/platinum", { body: output.credential }).ok}'
- tapOn: Home
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Upgrade now, center: true } }
- tapOn: Upgrade now
- tapOn: Upgrade Exa Card
- tapOn: Activate new Exa Card
- tapOn: Home
- runFlow: ../subflows/storeCoverage.yaml
