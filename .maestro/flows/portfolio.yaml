appId: ${APP_ID ?? "app.exactly"}
tags: [broad]
---
- runFlow: ../subflows/launch.yaml
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: USDC, to: "${output.account}", amount: "420" }
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: ETH, to: "${output.account}", amount: "0.1" }
- runFlow: ../subflows/portfolio.yaml
- runScript: { file: ../dist/awaitDeployment.js, env: { account: "${output.account}" } }
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: USDC.e, network: Anvil2, to: "${output.account}", amount: "100" }
- tapOn: Manage portfolio
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: "(.*, )?USDC\\.e(, .*)?" } }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back, index: 0 } }
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Borrow, center: true } }
- tapOn: Borrow
- assertVisible: Explore funding options
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back, index: 0 } }
- tapOn: { text: Home, leftOf: Card }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Deposit } }
- tapOn: Digital assets
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: USDT } }
- tapOn: USDT
- tapOn: Recommended
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Continue } }
- tapOn: Continue
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Close } }
- runFlow: ../subflows/storeCoverage.yaml
