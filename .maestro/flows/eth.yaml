appId: ${APP_ID ?? "app.exactly"}
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/eth.yaml
- runScript: { file: ../dist/mint.js, env: { asset: ETH, to: "${output.credential}", amount: "2" } }
- tapOn: Deposit
- tapOn: With connected wallet
- tapOn: { text: "0", index: 0 }
- inputText: "1"
- pressKey: enter
- tapOn: Transfer ETH
- runFlow: ../subflows/sign.yaml
- pressKey: escape
- assertVisible: Add funds request sent
- runScript: { file: ../dist/getBalance.js, env: { asset: ETH, account: "${output.account}" } }
- assertTrue: ${output.balance === 1}
- back
- back
- runFlow: ../subflows/storeCoverage.yaml
