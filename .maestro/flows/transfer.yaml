appId: ${APP_ID ?? "app.exactly"}
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/transfer.yaml
- tapOn: Send
- tapOn: Digital assets
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Scan QR code } }
- assertVisible: { id: "0x000000000000000000000000000000000000bEEF" }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- runScript:
    file: ../dist/downgradePlugin.js
    env: { account: "${output.account}" }
- tapOn: Card
- tapOn: Upgrade account now
- runFlow: ../subflows/sign.yaml
- runScript:
    file: ../dist/waitUpgrade.js
    env: { account: "${output.account}" }
- tapOn: Home
- runFlow: ../subflows/storeCoverage.yaml
