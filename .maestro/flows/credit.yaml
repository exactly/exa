appId: ${APP_ID ?? "app.exactly"}
env:
  method: ${method ?? "webauthn"}
---
- runFlow: ../subflows/launch.yaml
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: USDC, to: "${output.account}", amount: "420" }
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: ETH, to: "${output.account}", amount: "0.1" }
- runFlow: ../subflows/verifyIdentity.yaml
- tapOn: Card
- tapOn: Card details
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Accept and enable card } }
- tapOn: Accept and enable card
- assertVisible: Manually add your card to Apple Pay & Google Pay to make contactless payments.
- tapOn: Close
- tapOn: Home
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Later in 1, center: true } }
- tapOn: Later in 1
- tapOn: { text: Close, below: How installment repayment works }
- tapOn: Tap here to change the number of installments
- tapOn: { text: "3", below: Set installments }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Close } }
- runScript:
    file: ../dist/purchase.js
    env: { merchant: Coffee Shop, amount: "90", mode: "3", credentialId: "${output.credential}" }
- runFlow: { file: ../subflows/assertStatement.yaml, env: { merchant: Coffee Shop } }
- runFlow: ../subflows/credit.yaml
- runFlow: ../subflows/assertHistory.yaml
- tapOn: Activity
- tapOn: Debt rollover
- assertVisible: New due date
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- tapOn: Home
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Later in 3, center: true } }
- tapOn: Later in 3
- tapOn: { text: "1", below: Set installments }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Close } }
- runScript: { file: ../dist/mint.js, env: { asset: USDC, to: "${output.account}", amount: "1500", network: Anvil2 } }
- runScript: { file: ../dist/deposited.js, env: { account: "${output.account}", network: Anvil2 } }
- repeat:
    times: 20
    while: { true: "${output.deposited !== 1500}" }
    commands: [{ runScript: { file: ../dist/deposited.js, env: { account: "${output.account}", network: Anvil2 } } }]
- runScript:
    file: ../dist/purchase.js
    env: { merchant: Electronics, amount: "899.99", mode: "1", credentialId: "${output.credential}" }
- tapOn: Payments
- runFlow: { file: ../subflows/repay.yaml, env: { network: Anvil2 } }
- tapOn: Home
- runFlow: ../subflows/storeCoverage.yaml
