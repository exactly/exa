appId: ${APP_ID ?? "app.exactly"}
tags: [smoke, core, broad]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/logout.yaml
- runFlow: ../subflows/swap.yaml
- tapOn: Swap
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Select token } }
- tapOn: "(.*, )?USDC\\.e(, .*)?"
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Select token, index: 1 } }
- tapOn: { text: "(.*, )?USDC(, .*)?", index: 0 }
- tapOn: { text: "0", index: 0 }
- inputText: "4"
- pressKey: enter
- tapOn: Swap USDC.e for USDC
- runScript:
    file: ../dist/bridge.js
    env: { network: Anvil2, to: "${output.account}", amount: "4" }
- assertVisible: "(Swap )?completed"
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Close } }
- runFlow: ../subflows/assertOnboarding.yaml
- tapOn: Swap
- tapOn: { text: "0", index: 0 }
- inputText: "1"
- pressKey: enter
- tapOn: Swap USDC for EXA
- runFlow: ../subflows/sign.yaml
- assertVisible: "(Swap request )?sent"
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Close } }
- tapOn: Swap
- tapOn: { text: "0", index: 0 }
- inputText: "1"
- pressKey: enter
- assertVisible: You have a pending request. Wait for it to be processed before swapping again.
- runScript:
    file: ../dist/hookProposals.js
    env: { account: "${output.account}" }
- assertVisible: Swap USDC for EXA
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- runFlow:
    file: ../subflows/tapWhileAria.yaml
    env: { aria: Pending proposals, tap: Home }
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: ETH, to: "${output.account}", amount: "0.1" }
- runFlow: ../subflows/storeCoverage.yaml
