appId: ${APP_ID ?? "app.exactly"}
env:
  method: ${method ?? "webauthn"}
---
- runFlow: ../subflows/launch.yaml
- openLink: ${APP_ID}/missing
- tapOn: Go home
- assertTrue: '${http.post("http://localhost:3000/e2e/expiry", { body: output.credential }).ok}'
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Settings } }
- tapOn: Logout
- swipe: { start: "40%,30%", end: "10%,30%" }
- tapOn: Create new account
- tapOn: Learn more about passkeys
- tapOn: Close
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Close } }
- tapOn: I already have an account
- assertVisible: Good (morning|afternoon|evening)!
- assertTrue: '${http.post("http://localhost:3000/e2e/hold", { body: output.credential }).ok}'
- repeat:
    times: 10
    while: { true: "${!output.held}" }
    commands:
      - tapOn: Card
      - tapOn: Home
      - evalScript: ${output.held = http.get("http://localhost:3000/e2e/hold?credential=" + encodeURIComponent(output.credential)).ok}
- assertTrue: ${output.held}
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Settings } }
- tapOn: Logout
- runFlow: ../subflows/signIn.yaml
- assertVisible: Good (morning|afternoon|evening)!
- assertTrue: '${http.post("http://localhost:3000/e2e/release", { body: output.credential }).ok}'
- evalScript: ${output.previous = output.credential; output.account = undefined}
- runFlow: ../subflows/getAccount.yaml
- assertTrue: ${output.credential !== output.previous}
- runFlow: ../subflows/storeCoverage.yaml
- openLink: ${APP_ID}/e2e/session
- assertVisible: .*"${output.credential}".*
- openLink: ${APP_ID}
- runFlow: ../subflows/swap.yaml
- tapOn: Swap
- tapOn: { id: Select token, index: 0 }
- tapOn: USDC.e
- tapOn: { id: Select token, index: 1 }
- tapOn: { text: USDC, index: 0 }
- tapOn: { text: "0", index: 0 }
- inputText: "4"
- tapOn: Swap USDC.e for USDC
- runScript:
    file: ../dist/bridge.js
    env: { network: Anvil2, to: "${output.account}", amount: "4" }
- assertVisible: completed
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Close } }
- tapOn: Activity
- tapOn: Received from another network
- assertVisible: { text: Anvil2, rightOf: Source network }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- tapOn: Home
- runFlow: ../subflows/assertOnboarding.yaml
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: ETH, to: "${output.account}", amount: "0.1" }
- runFlow: ../subflows/storeCoverage.yaml
