appId: ${APP_ID ?? "app.exactly"}
---
- runFlow: ../subflows/launch.yaml
- openLink: ${APP_ID}/missing
- tapOn: Go home
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Settings } }
- tapOn: Logout
- tapOn: Create new account
- tapOn: Learn more about passkeys
- tapOn: Close
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Close } }
- tapOn: I already have an account
- assertVisible: Good (morning|afternoon|evening)!
- runFlow: ../subflows/swap.yaml
- runFlow: ../subflows/assertOnboarding.yaml
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: USDC, to: "${output.account}", amount: "420" }
- tapOn: Swap
- assertVisible: Swap USDC for .+
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Back } }
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: ETH, to: "${output.account}", amount: "0.1" }
- runFlow: ../subflows/storeCoverage.yaml
