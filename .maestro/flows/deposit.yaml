appId: ${APP_ID ?? "app.exactly"}
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/deposit.yaml
- runScript: { file: ../dist/mint.js, env: { asset: ETH, to: "${output.credential}", amount: "2" } }
- runScript: { file: ../dist/mint.js, env: { asset: ETH, to: "${output.credential}", amount: "1", network: Anvil2 } }
- runScript:
    file: ../dist/mint.js
    env: { asset: USDC.e, to: "${output.credential}", amount: "1000", network: Anvil2 }
- runScript: { file: ../dist/mint.js, env: { asset: USDT, to: "${output.credential}", amount: "10000" } }
- runFlow: ../subflows/readPortfolio.yaml
- evalScript: ${output.portfolioBefore = output.portfolio}
- tapOn: Deposit
- tapOn: With connected wallet
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Select token } }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Filter by network } }
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Anvil2 } }
- tapOn: USDC.e
- extendedWaitUntil: { visible: "Balance: .*1,000.*", timeout: 60000 }
- tapOn: { text: "0", index: 0 }
- inputText: "100"
- runFlow: { file: ../subflows/scrollTo.yaml, env: { element: Bridge and swap via } }
- tapOn: Bridge USDC.e
- repeat: { times: 3, commands: [{ runFlow: ../subflows/sign.yaml }] }
- extendedWaitUntil: { visible: Add funds request sent, timeout: 120000 }
- runScript: { file: ../dist/bridge.js, env: { network: Anvil2, to: "${output.deposit}", amount: "100" } }
- back
- tapOn: With connected wallet
- tapOn: { text: "0", index: 0 }
- inputText: "1"
- tapOn: Transfer USDT
- runFlow: ../subflows/sign.yaml
- assertVisible: Add funds request sent
- evalScript: '${output.usdt = JSON.parse(http.get("http://localhost:3000/e2e/lifi/v1/tokens").body).tokens[31337].find(({ symbol }) => symbol === "USDT").address}'
- assertTrue: '${Number(JSON.parse(http.post("http://localhost:8545", { body: JSON.stringify({ jsonrpc: "2.0", id: 0, method: "eth_call", params: [{ to: output.usdt, data: "0x70a08231" + output.deposit.slice(2).padStart(64, "0") }, "latest"] }) }).body).result) === 1e6}'
- runFlow: { file: ../subflows/tapAria.yaml, env: { aria: Close } }
- tapOn: Home
- runFlow: ../subflows/readPortfolio.yaml
- runScript: { file: ../dist/deposited.js, env: { account: "${output.deposit}" } }
- repeat:
    times: 20
    while: { true: "${output.portfolio - output.portfolioBefore !== 101 || output.deposited !== 100}" }
    commands:
      - tapOn: Home
      - runFlow: ../subflows/readPortfolio.yaml
      - runScript: { file: ../dist/deposited.js, env: { account: "${output.deposit}" } }
- assertTrue: ${output.portfolio - output.portfolioBefore === 101}
- assertTrue: ${output.deposited === 100}
- runFlow:
    file: ../subflows/mint.yaml
    env: { asset: USDC, to: "${output.account}", amount: "420" }
- evalScript: ${output.portfolioBefore = output.portfolio}
- tapOn: Swap
- assertVisible: LI.FI
- tapOn: { id: Select token, index: 1 }
- tapOn: Search by token name or address
- inputText: eth
- tapOn: WETH
- assertNotVisible: Select token to receive
- tapOn: { text: "0", index: 0 }
- inputText: "100"
- assertVisible: 1 USDC = 0\.0*[1-9]\d* WETH
- tapOn: Swap USDC for WETH
- runFlow: ../subflows/sign.yaml
- tapOn: View pending request
- assertVisible: Pending requests
- assertVisible: Swapping
- runScript:
    file: ../dist/hookProposals.js
    env: { account: "${output.account}" }
- back
- runFlow:
    file: ../subflows/tapWhileAria.yaml
    env: { aria: Pending proposals, tap: Home }
- runFlow: ../subflows/readPortfolio.yaml
- assertTrue: ${output.portfolioBefore - output.portfolio > 0 && output.portfolioBefore - output.portfolio < 1}
- runFlow: ../subflows/storeCoverage.yaml
