appId: app.exactly
---
- enrollBiometrics
- launchApp: { permissions: { all: deny, camera: allow } }
- tapOn: Create new account
- tapOn: Set passkey and create account
- takeScreenshot: .maestro/screenshots/sheet
- tapOn: Add Passkey
- extendedWaitUntil: { visible: Face ID, timeout: 10000 }
- takeScreenshot: .maestro/screenshots/faceid
- retry:
    maxRetries: 3
    commands:
      - matchBiometrics
      - extendedWaitUntil: { notVisible: Face ID, timeout: 5000 }
- extendedWaitUntil: { visible: "Stay updated|Good (morning|afternoon|evening)!", timeout: 60000 }
- takeScreenshot: .maestro/screenshots/home
