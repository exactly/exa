appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { platform: Android }
    commands:
      - launchApp: { appId: com.kunzisoft.keepass.libre, clearState: true }
      - repeat:
          while: { notVisible: Appearance }
          times: 5
          commands: [{ tapOn: Settings }]
      - tapOn: Appearance
      - scrollUntilVisible: { element: { text: Educational hints } }
      - tapOn: Educational hints
      - back
      - back
      - tapOn: Create new vault
      - extendedWaitUntil: { visible: "SAVE|Save", timeout: 15000 }
      - takeScreenshot: android-documents
      - tapOn: "SAVE|Save"
      - extendedWaitUntil: { visible: Assign a master key, timeout: 15000 }
      - tapOn: { id: "com.kunzisoft.keepass.libre:id/password_edit_text" }
      - inputText: "1111"
      - tapOn: { id: "com.kunzisoft.keepass.libre:id/password_confirmation" }
      - inputText: "1111"
      - hideKeyboard
      - tapOn: OK
      - extendedWaitUntil: { visible: { id: "com.kunzisoft.keepass.libre:id/lock_button" }, timeout: 15000 }
      - tapOn: { id: "com.kunzisoft.keepass.libre:id/lock_button" }
- launchApp: { clearState: true, permissions: { all: deny, camera: allow } }
- tapOn: Create new account
- runFlow:
    when: { visible: Sign up with Passkey }
    commands: [{ tapOn: Sign up with Passkey }]
- enrollBiometrics
- tapOn: Set passkey and create account
- runFlow:
    when: { platform: iOS }
    commands:
      - extendedWaitUntil: { visible: "Add Passkey|Continue", timeout: 30000 }
      - takeScreenshot: passkey-sheet
      - tapOn: "Add Passkey|Continue"
      - matchBiometrics
- runFlow:
    when: { platform: Android }
    commands:
      - extendedWaitUntil: { visible: "Create|Continue", timeout: 30000 }
      - takeScreenshot: android-credman
      - tapOn: "Create|Continue"
      - tapOn: "keepass(\\.kdbx)?"
      - tapOn: { id: "com.kunzisoft.keepass.libre:id/password_text_view" }
      - inputText: "1111"
      - tapOn: { id: "com.kunzisoft.keepass.libre:id/activity_password_open_button" }
      - runFlow:
          when: { visible: Check }
          commands:
            - tapOn: { id: "com.kunzisoft.keepass.libre:id/password_text_view" }
            - inputText: "1111"
            - tapOn: Check
      - tapOn: { id: "com.kunzisoft.keepass.libre:id/add_button" }
      - tapOn: { id: "com.kunzisoft.keepass.libre:id/fab_add_entry" }
      - runFlow:
          when: { visible: Check }
          commands:
            - tapOn: { id: "com.kunzisoft.keepass.libre:id/password_text_view" }
            - inputText: "1111"
            - tapOn: Check
      - tapOn: { id: "com.kunzisoft.keepass.libre:id/entry_edit_validate" }
- runFlow: subflows/dismissNotifications.yaml
- assertVisible: Good (morning|afternoon|evening)!
- takeScreenshot: home
