appId: ${APP_ID ?? "app.exactly"}
---
- assertTrue: ${amount && !Number.isNaN(Number(amount))}
- assertTrue: ${installments && !Number.isNaN(Number(installments))}
- tapOn: Borrow
- tapOn: Explore funding options
- runFlow: { file: tapAria.yaml, env: { aria: Amount } }
- inputText: ${amount}
- pressKey: enter
- tapOn: Continue
- tapOn: "${installments + ' installment' + (installments > 1 ? 's' : '') + ' of'}"
- tapOn: Continue
- tapOn: "^[A-Z][a-z]+ \\d+, \\d{4}$"
- tapOn: Continue
- runFlow:
    when: { true: "${!!receiver}" }
    commands:
      - tapOn: External address on Anvil
      - tapOn: Enter receiver address
      - inputText: ${receiver}
      - hideKeyboard
- tapOn: Review loan terms
- tapOn: "Confirm and ${receiver ? 'borrow' : 'receive'} USDC"
- runFlow: sign.yaml
- extendedWaitUntil: { visible: Funding request sent, timeout: 180000 }
