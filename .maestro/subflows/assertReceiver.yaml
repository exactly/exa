appId: ${APP_ID ?? "app.exactly"}
---
- tapOn: Enter ENS or wallet address
- inputText: ${receiver}
- hideKeyboard
- tapOn: Continue
- assertVisible: Select asset to send
- runFlow:
    when: { true: "${maestro.platform != 'web'}" }
    commands:
      - assertVisible: ${visible}
      - runFlow: { when: { true: "${!!hidden}" }, commands: [{ assertNotVisible: "${hidden}" }] }
- runFlow:
    when: { platform: web }
    commands:
      - assertVisible: { id: "${visible}" }
      - runFlow: { when: { true: "${!!hidden}" }, commands: [{ assertNotVisible: { id: "${hidden}" } }] }
- runFlow: { file: tapAria.yaml, env: { aria: Back } }
- runFlow: { file: tapAria.yaml, env: { aria: Clear } }
