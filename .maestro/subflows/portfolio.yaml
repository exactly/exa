appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    file: mint.yaml
    env: { asset: ETH, to: "${output.account}", amount: "0.1" }
- runFlow:
    file: send.yaml
    env: { asset: ETH, to: "0x000000000000000000000000000000000000dEaD", amount: "25", pay: ETH }
- tapOn: Manage portfolio
- assertVisible: Collateral assets
- tapOn: Collateral
- assertVisible: USDC
- assertNotVisible: Collateral assets
- tapOn: Stocks
- assertVisible: You don't hold any tokenized stocks yet.
- assertNotVisible: USDC
- tapOn: All
- assertVisible: Collateral assets
- tapOn: USDC
- runFlow: { file: scrollTo.yaml, env: { element: Sell } }
- assertVisible: Buy
- runFlow: { file: tapAria.yaml, env: { aria: Sell } }
- assertVisible: Swaps
- runFlow: { file: tapAria.yaml, env: { aria: Back } }
- assertVisible: Sell
- runFlow: { file: tapAria.yaml, env: { aria: Send } }
- assertVisible: Send to
- runFlow: { file: tapAria.yaml, env: { aria: Back } }
- runFlow: { file: scrollTo.yaml, env: { element: Balance } }
- runFlow: { file: tapAria.yaml, env: { aria: Back } }
- runFlow: { file: scrollTo.yaml, env: { element: ETH } }
- tapOn: ETH
- assertVisible: "\\+\\$100\\.00 \\(\\+4\\.17%\\)"
- runFlow: { file: scrollTo.yaml, env: { element: 1M } }
- tapOn: 1M
- assertVisible: "\\+\\$200\\.00 \\(\\+8\\.70%\\)"
- runFlow: { file: tapAria.yaml, env: { aria: Back } }
- assertVisible: Collateral assets
- runFlow: { file: tapAria.yaml, env: { aria: Back } }
- tapOn: Home
