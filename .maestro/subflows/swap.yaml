appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    file: mint.yaml
    env: { asset: EXA, to: "${output.account}", amount: "1000" }
- runFlow:
    file: send.yaml
    env: { asset: USDC.e, destination: Anvil2, to: "${output.account}", amount: "5", pay: EXA }
- runFlow:
    file: readPortfolio.yaml
    env: { above: "${output.portfolioBefore - 1}", below: "${output.portfolioBefore}", except: "${output.portfolioBefore}" }
- runScript:
    file: ../dist/awaitDeployment.js
    env: { account: "${output.account}", network: Anvil2 }
- runScript: { file: ../dist/downgradePlugin.js, env: { account: "${output.account}" } }
- runScript: { file: ../dist/downgradePlugin.js, env: { account: "${output.account}", network: Anvil2 } }
- tapOn: Card
- tapOn: Upgrade account now
- runFlow: sign.yaml
- runFlow: sign.yaml
- runScript: { file: ../dist/awaitUpgrade.js, env: { account: "${output.account}" } }
- runScript: { file: ../dist/awaitUpgrade.js, env: { account: "${output.account}", network: Anvil2 } }
- tapOn: Home
