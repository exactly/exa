appId: ${APP_ID ?? "app.exactly"}
---
- tapOn: Payments
- waitForAnimationToEnd
- assertVisible: Total outstanding
- assertVisible:
    text: \$[\s\d,.\xa0]+
    below: Total outstanding
- assertVisible: in \d+ payments?
- runFlow: { file: tapAria.yaml, env: { aria: Hide sensitive } }
- assertNotVisible:
    text: \$[\s\d,.\xa0]+
    below: Total outstanding
- runFlow: { file: tapAria.yaml, env: { aria: Show sensitive } }
- assertVisible:
    text: \$[\s\d,.\xa0]+
    below: Total outstanding
- assertVisible: { text: Pay, leftOf: Rollover }
- assertVisible: Rollover
- assertVisible: View statement
- runFlow: { file: tapAria.yaml, env: { aria: Total outstanding info } }
- assertVisible: This total includes all your purchases, loans, interest, and any applicable late fees.
- tapOn: Got it!
- runFlow: { file: tapAria.yaml, env: { aria: Payment info } }
- assertVisible: You can repay early and save on interest. The final amount updates automatically before you confirm.
- tapOn: Close
- tapOn: View statement
- tapOn: Export
- tapOn: Copy as plain text
- tapOn: Export
- tapOn: Copy as a table
- runFlow:
    when: { platform: web }
    commands:
      - tapOn: Export
      - evalScript: ${output.downloadStart = Date.now()}
      - tapOn: Download PDF
      - assertTrue: '${http.get("http://localhost:3000/e2e/download?since=" + output.downloadStart).ok}'
- runFlow: { file: tapAria.yaml, env: { aria: Back } }
- runFlow: { file: scrollTo.yaml, env: { element: See all } }
- tapOn: See all
- assertVisible: Payment history
- tapOn: { text: '[A-Z][a-z]+ \d{1,2}, \d{4}', below: Payment history, index: 0 }
- assertVisible: Due [A-Z][a-z]+ \d{1,2}, \d{4}
- tapOn: View statement
- assertVisible: Installment \d of 3
- runFlow: { file: tapAria.yaml, env: { aria: Back } }
- runFlow: { file: tapAria.yaml, env: { aria: Back } }
- tapOn: { text: Home, leftOf: Card }
- waitForAnimationToEnd
