appId: ${APP_ID ?? "app.exactly"}
---
# HACK https://github.com/mobile-dev-inc/Maestro/issues/2914
- runFlow:
    when: { true: "${maestro.platform != 'web'}" }
    commands:
      - retry:
          maxRetries: 3
          commands:
            - tapOn: { text: "${tap ?? aria}", index: 0 }
            - extendedWaitUntil: { notVisible: "${aria}", timeout: 5000 }
- runFlow:
    when: { platform: web }
    commands:
      - retry:
          maxRetries: 3
          commands:
            - runFlow:
                when: { true: "${typeof tap !== 'undefined'}" }
                commands: [{ tapOn: { text: "${tap}", index: 0 } }]
            - runFlow:
                when: { true: "${typeof tap === 'undefined'}" }
                commands: [{ tapOn: { id: "${aria}" } }]
            - extendedWaitUntil: { notVisible: { id: "${aria}" }, timeout: 5000 }
