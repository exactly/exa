appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { platform: web }
    commands:
      - tapOn: Send
      - tapOn: Bank transfers
      - tapOn: Reals via PIX
      - tapOn: Scan QR code
      - tapOn: Enter address
      - inputText: 123 Test St
      - hideKeyboard
      - tapOn: Continue
      - tapOn: Enter bank name
      - inputText: Test Bank
      - hideKeyboard
      - tapOn: Continue
      - assertVisible: "270.00"
      - tapOn: Continue
      - tapOn: Confirm and send
      - assertVisible: Sent to .*
      - assertVisible: .*Test <&> Co
      - runFlow: getAccount.yaml
      - runScript:
          file: ../dist/hookProposals.js
          env:
            account: "${output.account}"
            amount: "50"
            beneficiary: >-
              { "currency": "BRL", "address": { "streetLine1": "123 Test St", "city": "SAO PAULO",
              "postalCode": "01310100", "country": "BRA" }, "accountOwnerName": "Test <&> Co",
              "account": { "pixKey": "52998224725", "documentNumber": "52998224725" }, "bankName": "Test Bank",
              "reference": "exa" }
      - tapOn: Close
      - tapOn: Send
      - tapOn: Bank transfers
      - tapOn: Reals via PIX
      - tapOn: Test <&> Co
      - tapOn: "0.00"
      - inputText: "108"
      - tapOn: Continue
      - tapOn: Confirm and send
      - assertVisible: Sent to .*
      - runScript:
          file: ../dist/hookProposals.js
          env:
            account: "${output.account}"
            amount: "20"
            beneficiary: >-
              { "currency": "BRL", "address": { "streetLine1": "123 Test St", "city": "SAO PAULO",
              "postalCode": "01310100", "country": "BRA" }, "accountOwnerName": "Test <&> Co",
              "account": { "pixKey": "52998224725", "documentNumber": "52998224725" }, "bankName": "Test Bank",
              "reference": "exa" }
      - tapOn: Close
