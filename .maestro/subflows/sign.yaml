appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: "${method === 'metamask'}" }
    commands: [{ tapOn: Confirm }]
- runFlow:
    when: { true: "${method === 'brave'}" }
    commands: [{ tapOn: "Confirm|Sign( in)?" }]
- runFlow:
    when: { true: "${maestro.platform != 'web' && method === 'webauthn'}" }
    commands:
      - runFlow: { when: { platform: ios }, commands: [{ tapOn: Use Passkey }] }
      - matchBiometrics
