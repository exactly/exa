appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: "${method === 'metamask'}" }
    commands: [{ tapOn: Confirm }]
- runFlow:
    when: { true: "${method === 'brave'}" }
    commands: [{ tapOn: "Confirm|Sign( in)?" }]
- runFlow:
    when: { true: "${maestro.platform != 'web' && method === 'webauthn'}" }
    commands:
      - runFlow: { when: { platform: ios }, commands: [{ tapOn: Use Passkey }, matchBiometrics] }
      - runFlow:
          when: { platform: android }
          commands:
            - extendedWaitUntil: { visible: User Verification, timeout: 20000, optional: true }
            - runFlow: { when: { visible: User Verification }, commands: [matchBiometrics] }
