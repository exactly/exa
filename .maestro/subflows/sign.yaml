appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: "${maestro.platform == 'web' && method === 'metamask'}" }
    commands: [{ tapOn: Confirm }]
- runFlow:
    when: { true: "${maestro.platform == 'web' && method === 'brave'}" }
    commands: [{ tapOn: "Confirm|Sign( in)?" }]
- runFlow:
    when: { true: "${maestro.platform == 'web' && method === 'brave' && typeof transaction !== 'undefined'}" }
    commands: [{ pressKey: escape }]
