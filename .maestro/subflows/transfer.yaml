appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    file: mint.yaml
    env: { asset: USDC, to: "${output.account}", amount: "420" }
- runScript: { file: ../dist/awaitDeployment.js, env: { account: "${output.account}" } }
- tapOn: { text: Home, leftOf: Card }
- runFlow:
    file: send.yaml
    env: { asset: USDC, network: Anvil, to: "0x000000000000000000000000000000000000dEaD", amount: "69" }
- tapOn: Send
- tapOn: Digital assets
- assertVisible: Send to
- runFlow: { file: tapAria.yaml, env: { aria: Edit contact } }
- assertVisible: Delete contact
- runFlow: { file: tapAria.yaml, env: { aria: Delete contact } }
- assertNotVisible: Contacts
- runFlow: { file: tapAria.yaml, env: { aria: Send settings } }
- tapOn: Advanced mode
- tapOn: Close
- evalScript: ${output.advanced = true}
- runFlow: { file: tapAria.yaml, env: { aria: "0x000000000000000000000000000000000000dEaD" } }
- assertVisible: Select asset to send
- runFlow: { file: tapAria.yaml, env: { aria: "^EXA on .+$" } }
- runFlow: { file: tapAria.yaml, env: { aria: Back, index: 0 } }
- assertVisible: Select asset to send
- runFlow: { file: tapAria.yaml, env: { aria: Back, index: 0 } }
- assertVisible: Send to
- runFlow: { file: tapAria.yaml, env: { aria: Back, index: 0 } }
- runFlow: { file: tapAria.yaml, env: { aria: Back, index: 0 } }
- runFlow:
    when: { platform: web }
    commands:
      - tapOn: Send
      - tapOn: Digital assets
      - runFlow: { file: tapAria.yaml, env: { aria: Scan QR code } }
      - assertVisible: { id: "0x000000000000000000000000000000000000bEEF" }
      - runFlow: { file: tapAria.yaml, env: { aria: Back, index: 0 } }
      - runFlow: { file: tapAria.yaml, env: { aria: Back, index: 0 } }
