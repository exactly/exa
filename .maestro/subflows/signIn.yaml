appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: "${method === 'webauthn' && !login}" }
    commands:
      - tapOn: Create new account
      - enrollBiometrics
      - tapOn: Set passkey and create account
      - runFlow: { when: { platform: ios }, commands: [{ tapOn: Add Passkey }] }
      - runFlow: { when: { platform: android }, commands: [{ tapOn: Continue }] }
      - matchBiometrics
      - runFlow:
          when: { platform: android }
          commands:
            - tapOn: { id: com.kunzisoft.keepass.libre:id/add_button } # cspell:ignore kunzisoft keepass
            - tapOn: { id: com.kunzisoft.keepass.libre:id/fab_add_entry }
            - tapOn: { id: com.kunzisoft.keepass.libre:id/entry_edit_validate }
- runFlow:
    when: { true: "${method === 'webauthn' && !!login}" }
    commands:
      - tapOn: I already have an account
      - runFlow:
          when: { true: "${maestro.platform != 'web'}" }
          commands:
            - copyTextFrom: { text: ".*\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d.*", index: 0 }
            - evalScript: ${output.passkey = maestro.copiedText}
            - copyTextFrom: { text: ".*\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d.*", index: 1 }
            - evalScript: ${output.passkey = [output.passkey, maestro.copiedText].map((text) => text.match(/\d\d\d\d-\d\d-\d\dT\d\d:\d\d/)[0]).sort()[0]}
            - tapOn: .*${output.passkey}.*
            - runFlow: { when: { visible: Use Selected Passkey }, commands: [{ tapOn: Use Selected Passkey }] }
            - runFlow: { when: { visible: Continue }, commands: [{ tapOn: Continue }] }
            - matchBiometrics
- runFlow:
    when: { true: "${method !== 'webauthn' && method !== 'brave'}" }
    commands: [{ tapOn: I already have an account }, { tapOn: Log in with browser wallet }]
- runFlow:
    when: { true: "${maestro.platform == 'web' && method === 'metamask'}" }
    commands:
      - tapOn: Connect
      - assertVisible: Add Anvil
      - tapOn: Confirm
      - assertVisible: Sign-in request
- runFlow:
    when: { true: "${method === 'brave'}" }
    commands:
      - tapOn: Create new account
      - tapOn: Sign up with browser wallet
      - tapOn: Account 1.*
      - tapOn: Next
      - tapOn: Connect
      - tapOn: Approve
      - tapOn: { text: Switch network, index: 1 }
- runFlow: { when: { true: "${method !== 'webauthn'}" }, file: sign.yaml }
