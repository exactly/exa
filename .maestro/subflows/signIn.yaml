appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: "${method === 'webauthn' && !passkey}" }
    commands:
      - tapOn: Create new account
      - enrollBiometrics
      - evalScript: ${output.passkey = Math.floor(Date.now() / 60000)}
      - tapOn: Set passkey and create account
      - runFlow: { when: { platform: ios }, commands: [{ tapOn: Add Passkey }, matchBiometrics] }
      - runFlow:
          when: { platform: android }
          commands:
            - tapOn: Continue
            - extendedWaitUntil: { visible: User Verification, timeout: 20000, optional: true }
            - runFlow: { when: { visible: User Verification }, commands: [matchBiometrics] }
            - tapOn: { id: com.kunzisoft.keepass.libre:id/add_button } # cspell:ignore kunzisoft keepass
            - tapOn: { id: com.kunzisoft.keepass.libre:id/fab_add_entry }
            - tapOn: { id: com.kunzisoft.keepass.libre:id/entry_edit_validate }
      - evalScript: ${output.passkey = Array(Math.floor(Date.now() / 60000) - output.passkey + 1).fill(output.passkey).map((minute, index) => new Date((minute + index) * 60000).toISOString().slice(0, 16)).join("|")}
- runFlow:
    when: { true: "${method === 'webauthn' && !!passkey}" }
    commands:
      - tapOn: I already have an account
      - runFlow:
          when: { true: "${maestro.platform != 'web'}" }
          commands:
            - evalScript: ${output.shown = false}
            - runFlow:
                when: { visible: "(?!For ).*(${passkey}).*" }
                commands: [{ evalScript: "${output.shown = true}" }]
            - runFlow: { when: { true: "${!output.shown}", platform: android }, commands: [{ tapOn: Sign-in options }] }
            - scrollUntilVisible: { element: "(?!For ).*(${passkey}).*" }
            - tapOn: "(?!For ).*(${passkey}).*"
            - runFlow: { when: { visible: Use Selected Passkey }, commands: [{ tapOn: Use Selected Passkey }] }
            - runFlow: { when: { visible: Continue }, commands: [{ tapOn: Continue }] }
            - runFlow: { when: { platform: ios }, commands: [matchBiometrics] }
            - runFlow:
                when: { platform: android }
                commands:
                  - extendedWaitUntil: { visible: User Verification, timeout: 20000, optional: true }
                  - runFlow: { when: { visible: User Verification }, commands: [matchBiometrics] }
- runFlow:
    when: { true: "${method === 'metamask'}" }
    commands:
      - tapOn: I already have an account
      - tapOn: Log in with browser wallet
      - tapOn: Connect
      - assertVisible: Add Anvil
      - tapOn: Confirm
      - assertVisible: Sign-in request
- runFlow:
    when: { true: "${method === 'brave'}" }
    commands:
      - tapOn: Create new account
      - tapOn: Sign up with browser wallet
      - tapOn: Account 1.*
      - tapOn: Next
      - tapOn: Connect
      - tapOn: Approve
      - tapOn: { text: Switch network, index: 1 }
- runFlow: { when: { true: "${method !== 'webauthn'}" }, file: sign.yaml }
