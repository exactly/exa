appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: "${method === 'webauthn' && !passkey}" }
    commands:
      - tapOn: Create new account
      - enrollBiometrics
      - evalScript: ${output.passkey = Math.floor(Date.now() / 60000)}
      - runFlow: { when: { true: "${!!backup}" }, file: backup.yaml }
      - tapOn: Set passkey and create account
      - runFlow: savePasskey.yaml
      - runFlow:
          when: { true: "${maestro.platform != 'web' || !!output.backup}" }
          commands:
            - copyTextFrom: Stay updated|This passkey can’t be backed up
            - assertTrue: ${!output.backup || maestro.copiedText.startsWith('This passkey')}
            - runFlow:
                when: { true: "${maestro.copiedText.startsWith('This passkey')}" }
                commands:
                  - evalScript: ${output.rejected = Array(Math.floor(Date.now() / 60000) - output.passkey + 1).fill(output.passkey).map((minute, index) => new Date((minute + index) * 60000).toISOString().slice(0, 16)).join("|")}
                  - runFlow: { file: backup.yaml, env: { eligible: "true" } }
                  - tapOn: { text: Try again, below: This passkey can’t be backed up }
                  - runFlow: { file: savePasskey.yaml, env: { overwrite: ".*(${output.rejected}).*" } }
      - evalScript: ${output.passkey = Array(Math.floor(Date.now() / 60000) - output.passkey + 1).fill(output.passkey).map((minute, index) => new Date((minute + index) * 60000).toISOString().slice(0, 16)).join("|")}
- runFlow:
    when: { true: "${method === 'webauthn' && !!passkey}" }
    commands:
      - tapOn: I already have an account
      - runFlow:
          when: { true: "${maestro.platform != 'web'}" }
          commands:
            - scrollUntilVisible: { element: ".*(${passkey}).*" }
            - tapOn: .*(${passkey}).*
            - runFlow: { when: { visible: Use Selected Passkey }, commands: [{ tapOn: Use Selected Passkey }] }
            - runFlow: { when: { visible: Continue }, commands: [{ tapOn: Continue }] }
            - matchBiometrics
- runFlow:
    when: { true: "${method === 'metamask'}" }
    commands:
      - tapOn: I already have an account
      - tapOn: Log in with browser wallet
      - tapOn: Connect
      - assertVisible: Add Anvil
      - tapOn: Confirm
      - assertVisible: Sign-in request
- runFlow:
    when: { true: "${method === 'brave'}" }
    commands:
      - tapOn: Create new account
      - tapOn: Sign up with browser wallet
      - tapOn: Account 1.*
      - tapOn: Next
      - tapOn: Connect
      - tapOn: Approve
      - tapOn: { text: Switch network, index: 1 }
- runFlow: { when: { true: "${method !== 'webauthn'}" }, file: sign.yaml }
