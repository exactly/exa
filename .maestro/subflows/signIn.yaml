appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: "${method === 'webauthn'}" }
    commands:
      - tapOn: Create new account
      - enrollBiometrics
      - tapOn: Sign up with Passkey
      - tapOn: Set passkey and create account
      - matchBiometrics
      - runFlow: { file: tapAria.yaml, env: { aria: "Good (morning|afternoon|evening)!" } }
      - assertVisible: Address copied
      - copyTextFrom: 0x[\da-fA-F]{40}
      - evalScript: ${output.account = maestro.copiedText}
      - tapOn: Close
- runFlow:
    when: { true: "${method !== 'webauthn'}" }
    commands: [{ tapOn: I already have an account }, { tapOn: Log in with browser wallet }]
- runFlow:
    when: { true: "${maestro.platform == 'web' && method === 'siwe'}" }
    commands:
      - tapOn: Connect
      - assertVisible: Add Anvil
      - tapOn: Confirm
      - assertVisible: Sign-in request
- runFlow: sign.yaml
