appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: "${method === 'webauthn'}" }
    commands:
      - tapOn: Create new account
      - enrollBiometrics
      - tapOn: Set passkey and create account
      - runFlow: { when: { platform: ios }, commands: [{ tapOn: Add Passkey }] }
      - runFlow: { when: { platform: android }, commands: [{ tapOn: Continue }] }
      - matchBiometrics
      - runFlow:
          when: { platform: android }
          commands:
            - tapOn: { id: com.kunzisoft.keepass.libre:id/add_button } # cspell:ignore kunzisoft keepass
            - tapOn: { id: com.kunzisoft.keepass.libre:id/fab_add_entry }
            - tapOn: { id: com.kunzisoft.keepass.libre:id/entry_edit_validate }
- runFlow:
    when: { true: "${method !== 'webauthn'}" }
    commands: [{ tapOn: I already have an account }, { tapOn: Log in with browser wallet }]
- runFlow:
    when: { true: "${maestro.platform == 'web' && method === 'siwe'}" }
    commands:
      - tapOn: Connect
      - assertVisible: Add Anvil
      - tapOn: Confirm
      - assertVisible: Sign-in request
      - runFlow: sign.yaml
