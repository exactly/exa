appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: "${typeof center === 'undefined'}" }
    commands: [{ scrollUntilVisible: { element: "${element}" } }]
- runFlow:
    when: { true: "${typeof center !== 'undefined'}" }
    commands: [{ scrollUntilVisible: { element: "${element}", centerElement: true } }]
- runFlow:
    when: { true: "${typeof offset !== 'undefined' && Number(offset) > 0}" }
    commands:
      - evalScript: ${output.scrollExtra = 0}
      - repeat:
          while:
            true: "${output.scrollExtra < Number(offset)}"
          commands:
            - swipe:
                start: "50%,70%"
                end: "50%,50%"
            - evalScript: ${output.scrollExtra = output.scrollExtra + 1}
