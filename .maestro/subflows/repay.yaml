appId: ${APP_ID ?? "app.exactly"}
---
- tapOn: { text: Payments, index: -1 }
- runFlow:
    when: { true: "${sheet}" }
    commands:
      - runFlow: { file: scrollTo.yaml, env: { element: "Upcoming payments", center: true } }
      - copyTextFrom:
          text: "[A-Z].+"
          below: Upcoming payments
          index: 0
      - evalScript: ${output.maturity = maestro.copiedText}
      - copyTextFrom:
          text: \$[\d,.]+
          below: Upcoming payments
          index: 0
      - evalScript: ${output.debt = Number(maestro.copiedText.slice(1).split(",").join(""))}
      - tapOn: { text: "${output.maturity}", below: Upcoming payments }
      - waitForAnimationToEnd
      - tapOn: { text: Pay, index: -1 }
- runFlow:
    when: { true: "${!sheet}" }
    commands:
      - copyTextFrom:
          text: "[A-Z][a-z]+ \\d+, \\d{4} - .+"
          below: Due in .+
      - evalScript: ${output.maturity = maestro.copiedText}
      - tapOn: { text: Pay, leftOf: Rollover }
- runFlow:
    when: { true: "${amount}" }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: Repay amount } }
      - inputText: ${amount}
      - pressKey: enter
- runFlow:
    when: { true: "${market}" }
    commands:
      - tapOn: Pay with
      - runFlow: { file: tapAria.yaml, env: { aria: "^${market}, [\\s\\d,.\\xa0]+ available$" } }
- waitForAnimationToEnd
- tapOn: Confirm payment
- runFlow: sign.yaml
- assertVisible: Transaction details
- tapOn: Close
- runFlow: getAccount.yaml
- runScript:
    file: ../dist/hookProposals.js
    env: { account: "${output.account}" }
- runFlow:
    file: ../subflows/tapWhileAria.yaml
    env: { aria: Pending proposals, tap: Home }
- tapOn: Payments
- runFlow:
    when: { true: "${!amount}" }
    commands: [{ assertNotVisible: "${output.maturity}" }]
- runFlow:
    when: { true: "${amount}" }
    commands:
      - assertVisible:
          text: \$(${[-0.01, 0, 0.01].map((delta) => (output.debt - Number(amount) + delta).toFixed(2)).join("|")})
          below: Upcoming payments
