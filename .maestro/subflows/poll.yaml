appId: ${APP_ID ?? "app.exactly"}
---
- evalScript: ${output.deadline = Date.now() + 60000; output.polled = false}
- repeat:
    while: { true: "${!output.polled && Date.now() < output.deadline}" }
    commands:
      - tapOn: Home
      - runFlow: readPortfolio.yaml
      - runScript: { when: { true: "${!!deposit}" }, file: ../dist/deposited.js, env: { account: "${deposit}" } }
      - evalScript: ${output.polled = !!eval(until)}
- assertTrue: ${output.polled}
