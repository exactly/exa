appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: false } # HACK
    commands:
      - tapOn: View all steps
      - tapOn: Begin verifying
      - assertVisible: We need some information to help us confirm your identity.
      - tapOn: Begin verifying
      - tapOn: Select
      - tapOn: Passport
      - runFlow:
          when: { platform: ios }
          commands:
            - runFlow:
                when: { visible: Couldn't access camera }
                commands: [{ tapOn: Continue }]
      - tapOn: "${maestro.platform == 'android' ? 'take picture' : 'Take Photo'}"
      - tapOn: Use this photo
      - assertVisible: Address
      - runFlow: # HACK
          when: { platform: ios }
          commands: [{ tapOn: Address }]
      - scrollUntilVisible: { element: Continue }
      - tapOn: Continue
      - assertVisible: Let's make sure you’re you
      - tapOn: Get started
      - assertVisible: Center yourself on the screen
      - tapOn: { below: Auto capture on, enabled: true }
      - assertVisible: Look slightly left
      - tapOn: { below: Auto capture on, enabled: true }
      - assertVisible: Look slightly right
      - tapOn: { below: Auto capture on, enabled: true }
      - assertVisible: What is your email address?
      - runFlow:
          when: { platform: android }
          commands: [{ tapOn: Email address }]
      - inputText: test@test.com
      - hideKeyboard
      - tapOn: Continue
      - assertVisible: Confirm your email address
      - runFlow:
          when: { platform: android }
          commands: [{ tapOn: Confirmation Code }]
      - inputText: "12345"
      - hideKeyboard
      - tapOn: Continue
      - assertVisible: What is your phone number?
      - tapOn: { id: textinput_prefix_text } # cspell:ignore textinput
      - scrollUntilVisible: { element: 🇦🇷 Argentina +54 }
      - tapOn: 🇦🇷 Argentina +54
      - tapOn:
          containsChild: { containsChild: { id: textinput_prefix_text } } # cspell:ignore textinput
      - inputText: "1199999999"
      - hideKeyboard
      - tapOn: Continue
      - assertVisible: Confirm your phone number
      - runFlow: # HACK
          when: { platform: android }
          commands: [{ tapOn: { id: first } }]
      - inputText: "1234"
      - hideKeyboard
      - extendedWaitUntil: { visible: Economic activity }
      - tapOn: Economic activity
      - tapOn: Science
      - tapOn: Travel Usage
      - tapOn: .*US\$.*
      - tapOn: .*US\$.*
      - tapOn: Continue
      - assertVisible: Do you engage in any of the following activities?
      - tapOn: Select
      - tapOn: \s*No\s*
      - tapOn: Continue
      - repeat: { times: 6, commands: [{ tapOn: square }] }
      - tapOn: Continue
      - tapOn: Done
      - runFlow: { file: tapAria.yaml, env: { aria: Back } }
- runFlow:
    when: { true: "${maestro.platform == 'web' && persona == 'sandbox'}" }
    commands:
      - tapOn: View all steps
      - tapOn: Begin verifying
      - tapOn: { id: Close }
      - swipe: { start: "50%,50%", end: "50%,20%" }
      - tapOn: Begin verifying
      - tapOn: .*older than 18.*
      - tapOn: Select
      - tapOn: Passport
      - assertVisible: Upload a photo
      - addMedia: [../generated/passport.png]
      - scrollUntilVisible: { element: Use this photo }
      - tapOn: Use this photo
      - scrollUntilVisible: { element: Continue }
      - tapOn: Continue
      - scrollUntilVisible: { element: Get started }
      - tapOn: Get started
      - scrollUntilVisible: { element: { id: liveness_scanner__capture--manual } }
      - tapOn: { id: liveness_scanner__capture--manual, enabled: true }
      - assertVisible: Look slightly left
      - tapOn: { id: liveness_scanner__capture--manual, enabled: true }
      - assertVisible: Look slightly right
      - tapOn: { id: liveness_scanner__capture--manual, enabled: true }
      - tapOn: Email address
      - inputText: ${Date.now()}@e2e.exa
      - tapOn: Continue
      - tapOn: Confirmation Code
      - inputText: "12345"
      - tapOn: Continue
      - tapOn: { id: input_phone_number }
      - inputText: "1199999999"
      - tapOn: Continue
      - tapOn: { id: input_confirmation_code }
      - inputText: "1234"
      - tapOn: Continue
      - tapOn: Economic activity
      - inputText: "Science\tTravel\t<\t<"
      - scrollUntilVisible: { element: Continue }
      - tapOn: Continue
      - scrollUntilVisible: { element: Select }
      - tapOn: Select
      - inputText: "No"
      - scrollUntilVisible: { element: Continue }
      - tapOn: Continue
      - tapOn: I certify that.*
      - tapOn: { text: "I accept the ", point: "10%,50%" }
      - tapOn: { text: I accept the\s+of the Exa Card, point: "10%,50%" }
      - tapOn: { text: I accept the \., point: "10%,50%" }
      - scrollUntilVisible: { element: I acknowledge that.* }
      - tapOn: I acknowledge that.*
      - scrollUntilVisible: { element: Continue }
      - tapOn: Continue
      - assertVisible: Congratulations.*
      - assertTrue: '${http.post("http://localhost:3000/e2e/review", { body: "persona" }).ok}'
      - tapOn: { text: Done, below: Congratulations.* }
      - runFlow: { file: tapAria.yaml, env: { aria: Back } }
- runFlow:
    when: { visible: Getting Started, true: "${persona != 'sandbox'}" }
    commands:
      - runFlow: getAccount.yaml
      - runScript:
          file: ../dist/approveKYC.js
          env: { credentialId: "${output.credential}" }
- tapOn: Home
- assertNotVisible: Getting Started
- runFlow: { file: tapAria.yaml, env: { aria: Close } }
