appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: "${maestro.platform == 'web' && method === 'metamask'}" }
    commands:
      - tapOn: Enter your password
      - inputText: exa-e2e-wallet
      - tapOn: { id: unlock-submit }
- runFlow:
    when: { true: "${maestro.platform == 'web' && method === 'brave'}" }
    file: brave.yaml
- launchApp: { clearState: true, permissions: { all: deny, camera: allow } }
- runFlow: hideDevtools.yaml
- runFlow: signIn.yaml
- runFlow: dismissNotifications.yaml
- assertVisible: ${landing ?? "Good (morning|afternoon|evening)!"}
- runFlow: { when: { true: "${!landing}" }, file: getAccount.yaml }
