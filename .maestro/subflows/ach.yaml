appId: ${APP_ID ?? "app.exactly"}
---
- tapOn: Home
- tapOn: { text: Send, enabled: true }
- tapOn: Bank transfers
- tapOn: Dollars via ACH or WIRE
- runFlow:
    when: { true: "${!output.bridge}" }
    commands:
      - assertVisible: Send USD using your USDC
      - tapOn: Continue
      - tapOn: Accept and continue
- tapOn: Transfer to a new beneficiary
- tapOn: ACH
- tapOn: Continue
- tapOn: Enter beneficiary's full name
- inputText: Ann
- tapOn: Enter address
- inputText: 1 Elm
- pressKey: enter
- tapOn: Enter city
- inputText: Rye
- pressKey: enter
- swipe: { from: City, direction: UP }
- tapOn: Select country
- tapOn: Search
- inputText: of am
- pressKey: enter
- tapOn: United States of America
- tapOn: Select state
- tapOn: Search
- inputText: yo
- pressKey: enter
- tapOn: New York
- tapOn: Enter zip code
- inputText: "10580"
- pressKey: enter
- tapOn: Continue
- tapOn: Enter beneficiary's account number
- inputText: "1234"
- tapOn: Enter beneficiary's routing number
- inputText: "021000021"
- pressKey: enter
- tapOn: Enter bank name
- inputText: Bank
- pressKey: enter
- tapOn: Continue
- assertVisible: How much do you want to send?
- tapOn: "0.00"
- inputText: "69"
- pressKey: enter
- tapOn: Continue
- assertVisible: Review and confirm
- tapOn: Confirm and send
- runFlow: sign.yaml
- assertVisible: Sent to .*
- runFlow: getAccount.yaml
- runScript:
    file: ../dist/hookProposals.js
    env:
      account: "${output.account}"
      amount: "69"
      beneficiary: >-
        { "currency": "USD", "accountOwnerName": "Ann", "accountNumber": "1234", "routingNumber": "021000021",
        "bankName": "Bank", "address": { "streetLine1": "1 Elm", "city": "Rye", "state": "NY",
        "postalCode": "10580", "country": "USA" }, "rail": "ach" }
- tapOn: Close
