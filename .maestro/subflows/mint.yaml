appId: ${APP_ID ?? "app.exactly"}
---
- assertTrue: ${asset && to && amount && !Number.isNaN(Number(amount))}
- runFlow: ../subflows/readPortfolio.yaml
- evalScript: ${output.portfolioBefore = output.portfolio}
- runFlow: getAccount.yaml
- runScript: { file: ../dist/mint.js }
- repeat:
    times: 20
    while: { true: "${output.portfolio - output.portfolioBefore !== output.usd}" }
    commands: [{ tapOn: { text: Home, leftOf: Card } }, { runFlow: ../subflows/readPortfolio.yaml }]
- assertTrue: ${output.portfolio - output.portfolioBefore === output.usd}
