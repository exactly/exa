appId: ${APP_ID ?? "app.exactly"}
---
- runFlow: { file: tapAria.yaml, env: { aria: Settings } }
- tapOn: Submit coverage
- runFlow:
    when: { platform: android }
    commands: [{ assertVisible: Finished }]
- runFlow:
    when: { platform: ios }
    commands: [{ assertVisible: "Submit coverage, Finished" }]
- runFlow:
    when: { platform: web }
    commands: [{ assertVisible: { id: Finished } }]
