appId: com.android.settings
---
- launchApp
- scrollUntilVisible: { element: Security.* }
- tapOn: Security.*
- scrollUntilVisible: { element: Device unlock }
- tapOn: Device unlock
- scrollUntilVisible: { element: .*Fingerprint.* }
- tapOn: .*Fingerprint.*
- extendedWaitUntil: { visible: .*PIN.*, timeout: 10000 }
- inputText: "1111"
- pressKey: Enter
- runFlow: { when: { visible: Ways to unlock }, commands: [tapOn: Tap to set up fingerprint] }
- repeat:
    times: 5
    while: { notVisible: I agree }
    commands:
      - tapOn: More
- tapOn: I agree
- repeat:
    times: 10
    while: { notVisible: Fingerprint added }
    commands:
      - matchBiometrics
      - waitForAnimationToEnd
- tapOn: Done
