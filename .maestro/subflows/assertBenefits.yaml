appId: ${APP_ID ?? "app.exactly"}
---
- tapOn: Discounts on travel insurance
- assertVisible: Go to Pax Assistance
- runFlow: { file: tapAria.yaml, env: { aria: Close } }
- waitForAnimationToEnd
- runFlow:
    when: { true: "${maestro.platform != 'web'}" }
    commands: [{ swipe: { from: Discounts on travel insurance, direction: LEFT } }]
- runFlow: # HACK maestro web swipes the window instead of the element
    when: { platform: web }
    commands: [{ swipe: { start: "65%,50%", end: "35%,50%" } }]
- tapOn: Visa Signature benefits
- assertVisible: Go to Visa
- runFlow: { file: tapAria.yaml, env: { aria: Close } }
