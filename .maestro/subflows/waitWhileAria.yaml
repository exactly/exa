appId: ${APP_ID ?? "app.exactly"}
---
# HACK https://github.com/mobile-dev-inc/Maestro/issues/2914
- runFlow:
    when: { true: "${maestro.platform != 'web'}" }
    commands: [{ extendedWaitUntil: { notVisible: "${aria}", timeout: 30000 } }]
- runFlow:
    when: { platform: web }
    commands: [{ extendedWaitUntil: { notVisible: { id: "${aria}" }, timeout: 30000 } }]
