appId: ${APP_ID ?? "app.exactly"}
---
- assertTrue: ${asset && to && amount && !Number.isNaN(Number(amount))}
- runFlow: ../subflows/readPortfolio.yaml
- evalScript: ${output.portfolioBefore = output.portfolio}
- tapOn: Send
- tapOn: Digital assets
- assertVisible: Send to
- runFlow:
    when: { visible: "Send anything, anywhere" }
    commands:
      - tapOn: Not now
      - runFlow: { file: tapAria.yaml, env: { aria: Dismiss } }
- runFlow:
    when: { true: "${!!pay}", notVisible: Advanced mode on. }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: Send settings } }
      - tapOn: Advanced mode
      - tapOn: Close
      - assertVisible: Advanced mode on.
- runFlow:
    when: { true: "${!pay}", visible: Advanced mode on. }
    commands:
      - tapOn: Turn off
      - assertNotVisible: Advanced mode on.
- tapOn: Enter ENS or wallet address
- inputText: not-a-real-name.eth
- extendedWaitUntil: { visible: No address found.*, timeout: 15000 }
- eraseText
- inputText: "0xdead"
- eraseText: 6
- inputText: ${to}
- runFlow:
    when: { true: "${!pay}" }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: Save contact } }
      - assertNotVisible: Save contact
      - runFlow: { file: tapAria.yaml, env: { aria: Clear } }
      - assertVisible: Contacts
      - runFlow: { file: tapAria.yaml, env: { aria: Edit contact } }
      - assertVisible: Delete contact
      - runFlow: { file: tapAria.yaml, env: { aria: Delete contact } }
      - assertNotVisible: Contacts
      - tapOn: Enter ENS or wallet address
      - inputText: ${to}
- hideKeyboard
- tapOn: Continue
- assertVisible: Select asset to send
- runFlow: { file: tapAria.yaml, env: { aria: Select network } }
- tapOn: All networks
- tapOn: Search assets
- inputText: ${asset}
- runFlow:
    when: { true: "${!pay}" }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: "^${asset}, [\\s\\d,.\\xa0]+ available$" } }
- runFlow:
    when: { true: "${!!pay}" }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: "^${asset} on .+$" } }
- runFlow: { file: tapAria.yaml, env: { aria: Amount } }
- inputText: "9999"
- assertNotVisible: Review
- eraseText: 4
- inputText: ${amount}
- tapOn: "^Send .+ on .+$"
- runFlow: { file: tapAria.yaml, env: { aria: Switch amount currency } }
- runFlow: { file: tapAria.yaml, env: { aria: Switch amount currency } }
- runFlow:
    when: { true: "${!!pay}" }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: Select an asset } }
      - assertVisible: Search assets
      - runFlow: { file: tapAria.yaml, env: { aria: "^${pay}, [\\s\\d,.\\xa0]+ available$" } }
      - assertNotVisible: Search assets
- tapOn: Review
- runFlow:
    when: { true: "${!!pay && pay !== asset}" }
    commands:
      - assertVisible: Swap assets
      - tapOn: Continue
      - assertNotVisible: Swap assets
- assertVisible: Review and send
- runFlow:
    when: { true: "${maestro.platform != 'web'}" }
    commands: [{ longPressOn: "Hold to send ${asset}" }]
- runFlow:
    when: { platform: web }
    commands: [{ tapOn: "Send ${asset}" }]
- assertVisible: Transaction details
- runFlow: getAccount.yaml
- runScript:
    file: ../dist/hookProposals.js
    env: { account: "${output.account}" }
- runFlow: { file: tapAria.yaml, env: { aria: Close } }
- tapOn: Home
- runFlow:
    file: ../subflows/tapWhileAria.yaml
    env: { aria: Pending proposals, tap: Home }
- runFlow: ../subflows/readPortfolio.yaml
- assertTrue: ${output.portfolioBefore - output.portfolio === Number(amount) || (!!pay && pay !== asset && output.portfolioBefore - output.portfolio > Number(amount))}
