appId: ${APP_ID ?? "app.exactly"}
---
- assertTrue: ${asset && to && amount && !Number.isNaN(Number(amount))}
- runFlow: ../subflows/readPortfolio.yaml
- evalScript: ${output.portfolioBefore = output.portfolio}
- runFlow: { file: scrollTo.yaml, env: { element: Send, center: true } }
- tapOn: Send
- tapOn: Digital assets
- assertVisible: Send to
- runFlow:
    when: { true: "${!output.introSheet}" }
    commands:
      - assertVisible: Send anything, anywhere
      - tapOn: "${pay ? 'Turn it on' : 'Not now'}"
      - runFlow: { file: tapAria.yaml, env: { aria: Dismiss } }
      - evalScript: ${output.introSheet = true, output.advanced = !!pay}
- runFlow:
    when: { true: "${!!pay && !output.advanced}" }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: Send settings } }
      - tapOn: Advanced mode
      - tapOn: Close
      - assertVisible: Advanced mode on.
      - evalScript: ${output.advanced = true}
- runFlow:
    when: { true: "${!pay && !!output.advanced}" }
    commands:
      - tapOn: Turn off
      - assertNotVisible: Advanced mode on.
      - evalScript: ${output.advanced = false}
- tapOn: Enter ENS or wallet address
- runFlow:
    when: { true: "${!pay}" }
    commands:
      - inputText: not-a-real-name.eth
      - extendedWaitUntil: { visible: No address found.*, timeout: 15000 }
      - eraseText: 19
      - inputText: "0xdead"
      - eraseText: 6
      - inputText: ${to}
      - runFlow: { file: tapAria.yaml, env: { aria: Save contact } }
      - assertNotVisible: Save contact
      - runFlow: { file: tapAria.yaml, env: { aria: Clear } }
      - assertVisible: Contacts
      - runFlow: { file: tapAria.yaml, env: { aria: "${to}" } }
- runFlow:
    when: { true: "${!!pay}" }
    commands:
      - inputText: ${to}
      - hideKeyboard
      - tapOn: Continue
- assertVisible: Select asset to send
- runFlow:
    when: { true: "${!!network}" }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: Select network } }
      - tapOn: { text: "${network}", below: All networks }
- tapOn: Search assets
- inputText: ${asset}
- runFlow:
    when: { true: "${!pay}" }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: "^${asset}, [\\s\\d,.\\xa0]+ available$" } }
- runFlow:
    when: { true: "${!!pay}" }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: "^${asset} on .+$" } }
- runFlow: { file: tapAria.yaml, env: { aria: Amount } }
- runFlow:
    when: { true: "${!pay}" }
    commands:
      - inputText: "9999"
      - assertVisible: Insufficient balance. Try a different amount.
      - eraseText: 4
- inputText: ${amount}
- tapOn: "^Send .+ on .+$"
- runFlow:
    when: { true: "${!pay}" }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: Switch amount currency } }
      - runFlow: { file: tapAria.yaml, env: { aria: Switch amount currency } }
- runFlow:
    when: { true: "${!!pay}" }
    commands:
      - runFlow: { file: tapAria.yaml, env: { aria: Select an asset } }
      - runFlow:
          when: { true: "${pay === asset}" }
          commands: [{ assertVisible: Search assets }]
      - runFlow:
          when: { true: "${pay !== asset}" }
          commands: [{ tapOn: Search assets }, { inputText: "${pay}" }]
      - runFlow: { file: tapAria.yaml, env: { aria: "^${pay}, [\\s\\d,.\\xa0]+ available$" } }
      - assertNotVisible: Search assets
- tapOn: Review
- runFlow:
    when: { true: "${!!pay && pay !== asset && !output.swapSheet}" }
    commands:
      - assertVisible: "${destination ? 'Swap across networks' : 'Swap assets'}"
      - tapOn: Continue
      - assertNotVisible: "${destination ? 'Swap across networks' : 'Swap assets'}"
      - evalScript: ${output.swapSheet = true}
- assertVisible: Review and send
- runFlow:
    when: { true: "${!!destination}" }
    commands: [{ runFlow: { file: scrollTo.yaml, env: { element: "~2 min" } } }]
- runFlow:
    when: { true: "${maestro.platform != 'web'}" }
    commands: [{ longPressOn: "Hold to send ${asset}" }]
- runFlow:
    when: { platform: web }
    commands: [{ tapOn: "Send ${asset}" }]
- runFlow: sign.yaml
- assertVisible: (Processing send|Sent) to .*
- runFlow: getAccount.yaml
- runScript:
    file: ../dist/hookProposals.js
    env: { account: "${output.account}" }
- runFlow:
    when: { true: "${!pay}" }
    commands: [{ assertVisible: Sent to .* }]
- runFlow:
    when: { true: "${!!destination}" }
    commands:
      - runScript:
          file: ../dist/bridge.js
          env: { destination: "${destination}", to: "${to}", amount: "${amount}" }
      - assertVisible: Funds delivered on ${destination}
- runFlow: { file: tapAria.yaml, env: { aria: Close } }
- tapOn: Home
- runFlow:
    file: ../subflows/tapWhileAria.yaml
    env: { aria: Pending proposals, tap: Home }
- runFlow: ../subflows/readPortfolio.yaml
- assertTrue: ${!!destination || output.portfolioBefore - output.portfolio === Number(amount) || (!!pay && pay !== asset && output.portfolioBefore - output.portfolio > Number(amount))}
