appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    file: borrow.yaml
    env: { amount: "69", installments: "4" }
- runFlow: rollover.yaml
- runScript:
    file: ../dist/passMaturity.js
    env: { account: "${output.account}" }
- runFlow: { file: repay.yaml, env: { amount: "13", sheet: "true" } }
- runFlow: { file: repay.yaml, env: { market: ETH, overdue: "true" } }
- runFlow: assertPayments.yaml
