appId: ${APP_ID ?? "app.exactly"}
---
- tapOn: Payments
- runFlow: { file: scrollTo.yaml, env: { element: See all } }
- tapOn: See all
- assertVisible: Payment history
- tapOn: { text: '[A-Z][a-z]+ \d{1,2}, \d{4}', below: Payment history, index: 0 }
- assertVisible: Due [A-Z][a-z]+ \d{1,2}, \d{4}
- tapOn: View statement
- assertVisible: Installment \d of 3
- runFlow: { file: tapAria.yaml, env: { aria: Back } }
- runFlow: { file: tapAria.yaml, env: { aria: Back } }
- tapOn: Home
