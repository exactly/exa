appId: ${APP_ID ?? "app.exactly"}
---
- runFlow:
    when: { true: "${maestro.platform == 'web' && method === 'webauthn'}" }
    commands:
      - openLink: ${APP_ID}/missing
      - tapOn: Go home
      - runFlow: { file: tapAria.yaml, env: { aria: Settings } }
      - tapOn: Logout
      - swipe: { start: "40%,30%", end: "10%,30%" }
      - tapOn: Create new account
      - tapOn: Learn more about passkeys
      - tapOn: Close
      - runFlow: { file: tapAria.yaml, env: { aria: Close } }
      - tapOn: I already have an account
      - assertVisible: Good (morning|afternoon|evening)!
