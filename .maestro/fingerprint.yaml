appId: com.android.settings
---
- enrollBiometrics
- launchApp
- scrollUntilVisible: { element: Security }
- tapOn: Security
- tapOn: Pixel Imprint
- tapOn: { id: com.android.settings:id/password_entry }
- inputText: "1111"
- pressKey: Enter
- repeat:
    times: 5
    while: { notVisible: I AGREE }
    commands:
      - tapOn: MORE
- tapOn: I AGREE
- extendedWaitUntil: { visible: Touch the sensor, timeout: 10000 }
- takeScreenshot: .maestro/screenshots/sensor
- repeat:
    times: 10
    while: { notVisible: Fingerprint added }
    commands:
      - matchBiometrics
      - waitForAnimationToEnd
- extendedWaitUntil: { visible: Fingerprint added, timeout: 10000 }
- takeScreenshot: .maestro/screenshots/added
