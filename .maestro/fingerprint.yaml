appId: com.android.settings
---
- enrollBiometrics
- extendedWaitUntil: { visible: "Re-enter your PIN|Confirm your PIN|Enter your PIN", timeout: 30000 }
- inputText: "1111"
- pressKey: Enter
- repeat:
    times: 5
    while: { notVisible: "I agree|AGREE|Agree" }
    commands:
      - tapOn: { text: "More|MORE", optional: true }
- tapOn: "I agree|AGREE|Agree"
- takeScreenshot: .maestro/screenshots/sensor
- repeat:
    times: 20
    while: { notVisible: "Fingerprint added" }
    commands:
      - matchBiometrics
- takeScreenshot: .maestro/screenshots/added
- assertVisible: Fingerprint added
