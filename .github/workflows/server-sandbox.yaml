name: server/sandbox
on:
  push: { branches: [sandbox] }
jobs:
  build:
    uses: ./.github/workflows/server-build.yaml
    permissions: { artifact-metadata: write, contents: read, packages: write, attestations: write, id-token: write }
    with: { stack: sandbox, chain: 11155420, devtools: true }
  deploy:
    needs: build
    uses: ./.github/workflows/server-deploy.yaml
    permissions: { contents: read, id-token: write, packages: read }
    with: { stack: sandbox }
    secrets:
      DIGITALOCEAN_TOKEN: "${{ secrets.DIGITALOCEAN_TOKEN }}"
      SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}"
