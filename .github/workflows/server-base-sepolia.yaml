name: server/base-sepolia
on:
  push: { branches: [base-sepolia] }
jobs:
  build:
    uses: ./.github/workflows/server-build.yaml
    permissions: { artifact-metadata: write, contents: read, packages: write, attestations: write, id-token: write }
    with: { stack: base-sepolia, chain: 84532, devtools: true }
  deploy:
    needs: build
    uses: ./.github/workflows/server-deploy.yaml
    permissions: { contents: read, id-token: write, packages: read }
    with: { stack: base-sepolia }
    secrets:
      DIGITALOCEAN_TOKEN: "${{ secrets.DIGITALOCEAN_TOKEN }}"
      SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}"
