name: maestro
on:
  push: { paths: [.github/workflows/maestro.yaml, patches/maestro.patch] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.repository_owner }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: patch
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY-maestro:$(git hash-object patches/maestro.patch)"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "base=$(sed -n 's/^base-commit: //p' patches/maestro.patch)" >> "$GITHUB_OUTPUT"
          docker manifest inspect "$image" > /dev/null || echo "build=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.patch.outputs.build
        with:
          repository: mobile-dev-inc/Maestro
          ref: "${{ steps.patch.outputs.base }}"
          path: maestro
          persist-credentials: false
      - if: steps.patch.outputs.build
        run: git -C maestro apply ../patches/maestro.patch
      - if: steps.patch.outputs.build
        run: ./gradlew :maestro-cli:distZip -x :maestro-ios-driver:buildIosDriver # cspell:ignore gradlew
        working-directory: maestro
      - if: steps.patch.outputs.build
        run: |
          unzip -q maestro/maestro-cli/build/distributions/maestro.zip -d dist
          printf 'FROM scratch\nCOPY . /\n' | docker build --provenance=false -t "$IMAGE" -f - dist/maestro
          docker push "$IMAGE"
