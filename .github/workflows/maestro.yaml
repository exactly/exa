name: maestro
on:
  push:
    branches: [main]
    paths: [.maestro/package.json, .maestro/patches/*.patch]
jobs:
  maestro:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/maestro
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true, filter: blob:none, persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "^24.14.1" }
      - uses: oras-project/setup-oras@v2 # cspell:ignore oras
      - run: corepack enable
        name: corepack
      - run: pnpm install --frozen-lockfile --ignore-scripts
        name: install
      - run: GITHUB_STEP_SUMMARY= pnpm nx maestro e2e
        name: build
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.repository_owner }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: oras manifest fetch "$IMAGE:$(cat .maestro/build/hash)" > /dev/null || { tar -czf maestro.tgz --exclude hash -C .maestro/build . && oras push "$IMAGE:$(cat .maestro/build/hash)" maestro.tgz:application/vnd.oci.image.layer.v1.tar+gzip; }
        name: push
