name: maestro
on:
  push:
    branches: [main]
    paths: [.maestro/patches/build.sh, .maestro/patches/*.patch]
  workflow_dispatch:
jobs:
  maestro:
    runs-on: macos-latest
    permissions: { contents: read, packages: write }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/maestro
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true, filter: blob:none, persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "^24.14.1" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 } # cspell:ignore temurin
      - uses: oras-project/setup-oras@v2 # cspell:ignore oras
      - run: |
          corepack enable
          for delay in 5 10; do corepack install && exit; sleep "$delay"; done
          corepack install
        name: corepack
      - run: pnpm install --frozen-lockfile --ignore-scripts
        name: install
      - run: sudo xcode-select -s /Applications/Xcode_26.2.app && test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        name: drivers # cspell:ignore cmdline sdkmanager
      - run: GITHUB_STEP_SUMMARY= pnpm nx maestro e2e
        name: build
      - run: echo "$TOKEN" | oras login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
        name: login
        env: { TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: oras manifest fetch "$IMAGE:$(cat .maestro/build/hash)" > /dev/null || { COPYFILE_DISABLE=1 tar -czf maestro.tgz --exclude hash -C .maestro/build . && oras push "$IMAGE:$(cat .maestro/build/hash)" maestro.tgz:application/vnd.oci.image.layer.v1.tar+gzip; }
        name: push # cspell:ignore COPYFILE
