name: server/production
on:
  push: { tags: ["@exactly/server@*"] }
jobs:
  build:
    uses: ./.github/workflows/server-build.yaml
    permissions: { artifact-metadata: write, contents: read, packages: write, attestations: write, id-token: write }
    with: { stack: production, chain: 10, domain: web.exactly.app }
  deploy:
    needs: build
    uses: ./.github/workflows/server-deploy.yaml
    permissions: { contents: read, id-token: write, packages: read }
    with: { stack: production, domain: web.exactly.app }
    secrets:
      DIGITALOCEAN_TOKEN: "${{ secrets.DIGITALOCEAN_TOKEN }}"
      SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}"
