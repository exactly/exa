name: test
on:
  push: { branches-ignore: [changesets-ghcommit-temp/**] } # cspell:ignore ghcommit
jobs:
  test:
    environment: test
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: false
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
      OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
      OPTIMISM_SEPOLIA_RPC_URL: ${{ secrets.OPTIMISM_SEPOLIA_RPC_URL }}
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-node@v7
        with: { node-version: "^24.14.1" }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/svm
            /tmp/metro-cache
          key: deps-${{ runner.os }}-${{ github.job }}-${{ hashFiles('contracts/foundry.toml', 'pnpm-lock.yaml') }}
          restore-keys: deps-${{ runner.os }}-${{ github.job }}-
      - uses: actions/cache/restore@v6
        id: nx
        with:
          path: ~/.nx
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ github.job }}-
      - run: pip install -r contracts/requirements.txt
      - run: echo ::add-matcher::.github/matcher.json
      - run: flock /tmp/apt.lock sudo sh -c "apt-get update && apt-get install --no-install-recommends --yes redis-server" > apt.log 2>&1 &
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: flock /tmp/apt.lock pnpm nx run-many -t test
      - uses: actions/cache/save@v6
        if: github.ref_name == 'main'
        with: { path: ~/.nx, key: "${{ steps.nx.outputs.cache-primary-key }}" }

      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          disable_search: true
          exclude: node_modules
          plugins: noop
          files: contracts/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: contracts
          name: contracts
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          disable_search: true
          exclude: node_modules
          plugins: noop
          files: server/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: server
          name: server
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          report_type: test_results
          disable_search: true
          exclude: node_modules
          files: server/coverage/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: server
          name: server
      - if: ${{ !cancelled() }}
        run: echo "## [codecov](https://app.codecov.io/gh/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: server-artifacts
          path: |
            apt.log
            server/node_modules/@exactly/.*
          include-hidden-files: true

  e2e:
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flow: ach, method: webauthn, screen: 500x780 }
          - { flow: credit, method: webauthn, screen: 500x963 }
          - { flow: deposit, method: siwe, screen: 1920x1080 }
          - { flow: external, method: webauthn, screen: 600x608 }
          - { flow: onboarding, method: webauthn, screen: 500x1200 }
          - { flow: pix, method: webauthn, screen: 500x857 }
          - { flow: portfolio, method: webauthn, screen: 720x500 }
          - { flow: swap, method: webauthn, screen: 740x880 }
          - { flow: transfer, method: webauthn, screen: 760x600 }
    env:
      NX_DAEMON: false
      NX_MAX_CACHE_SIZE: 1GB
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
      CHAIN_ID: "31337"
      METAMASK_VERSION: 13.52.0
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-node@v7
        with: { node-version: "^24.14.1" }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - id: script
        run: echo "hash=$(node -p 'require("./.maestro/package.json").scripts.maestro' | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/svm
            .maestro/build
            /tmp/metro-cache
          key: deps-${{ runner.os }}-${{ github.job }}-${{ steps.script.outputs.hash }}-${{ hashFiles('.maestro/patches/*.patch', 'contracts/foundry.toml', 'pnpm-lock.yaml') }}
          restore-keys: deps-${{ runner.os }}-${{ github.job }}-
      - uses: actions/cache/restore@v6
        id: nx
        with:
          path: ~/.nx
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ github.job }}-
      - if: matrix.method == 'siwe'
        run: |
          curl -fsSLo $RUNNER_TEMP/metamask.zip https://github.com/MetaMask/metamask-extension/releases/download/v$METAMASK_VERSION/metamask-chrome-$METAMASK_VERSION.zip
          unzip -q $RUNNER_TEMP/metamask.zip -d $RUNNER_TEMP/metamask
          echo METAMASK=$RUNNER_TEMP/metamask >> "$GITHUB_ENV"
          echo SE_FORCE_BROWSER_DOWNLOAD=true >> "$GITHUB_ENV"
      - run: echo ::add-matcher::.github/matcher.json
      - run: flock /tmp/apt.lock sudo sh -c "apt-get update && apt-get install --no-install-recommends --yes redis-server" > apt.log 2>&1 &
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - if: hashFiles(format('.maestro/generated/{0}.y4m', matrix.flow)) != ''
        run: echo CAMERA=$PWD/.maestro/generated/${{ matrix.flow }}.y4m >> "$GITHUB_ENV"
      - run: GITHUB_STEP_SUMMARY= pnpm nx maestro e2e && echo "$PWD/.maestro/build/bin" >> "$GITHUB_PATH"
      - run: GITHUB_STEP_SUMMARY= flock /tmp/apt.lock pnpm nx e2e:web:release mobile > server.log 2>&1 & echo $! > server.pid
        env: { APP_DOMAIN: localhost, EXPO_PUBLIC_ENV: e2e }
      - if: matrix.method == 'siwe'
        id: metamask
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/profile
          key: metamask-${{ env.METAMASK_VERSION }}-${{ hashFiles('.maestro/**/metamask.yaml') }}
      - if: matrix.method == 'siwe' && steps.metamask.outputs.cache-hit != 'true'
        run: maestro test .maestro/flows/web/metamask.yaml --headless --screen-size 1920x1080 --browser-args=--force-prefers-reduced-motion --browser-args=--user-data-dir=$RUNNER_TEMP/profile --browser-args=--load-extension=$METAMASK --browser-args=--no-sandbox "--browser-args=--screen-info={3840x2160}" "--browser-args=--host-resolver-rules=MAP *.infura.io ~NOTFOUND, MAP *.metamask.io ~NOTFOUND"
      - if: matrix.method == 'siwe' && steps.metamask.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/profile
          key: ${{ steps.metamask.outputs.cache-primary-key }}
      - run: |
          for i in {1..420}; do
            curl -f http://localhost:3000/api/auth/authentication > /dev/null 2>&1 && curl -f http://localhost:8081 > /dev/null 2>&1 && break
            { [ $i -eq 420 ] || ! kill -0 $(cat server.pid); } && cat server.log && exit 1
            sleep 1
          done
          CHROME_LOG_FILE=$PWD/chrome.log maestro test .maestro/flows/web/${{ matrix.flow }}.yaml -e method=${{ matrix.method }} --format junit --output .maestro/junit.xml --headless --screen-size ${{ matrix.screen }} --browser-args=--force-prefers-reduced-motion ${CAMERA:+--browser-args=--use-fake-ui-for-media-stream --browser-args=--use-fake-device-for-media-stream --browser-args=--use-file-for-fake-video-capture=$CAMERA} ${METAMASK:+--browser-args=--user-data-dir=$RUNNER_TEMP/profile --browser-args=--load-extension=$METAMASK --browser-args=--no-sandbox "--browser-args=--screen-info={3840x2160}" "--browser-args=--host-resolver-rules=MAP *.infura.io ~NOTFOUND, MAP *.metamask.io ~NOTFOUND"}
      - if: always()
        run: |
          curl -X POST http://localhost:3000/e2e/shutdown || true
          for i in {1..60}; do [ -f server/coverage/lcov.info ] && break; sleep 1; done
      - uses: actions/cache/save@v6
        if: github.ref_name == 'main'
        with: { path: ~/.nx, key: "${{ steps.nx.outputs.cache-primary-key }}" }
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          disable_search: true
          exclude: node_modules
          plugins: noop
          files: server/coverage/lcov.info,server/coverage/app.json
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: web
          name: ${{ matrix.flow }}
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          report_type: test_results
          disable_search: true
          exclude: node_modules
          files: .maestro/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: web
          name: ${{ matrix.flow }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-${{ matrix.flow }}-artifacts
          path: |
            apt.log
            chrome.log
            server.log
            server/coverage
            server/node_modules/@exactly/.*
            ~/.maestro/tests
            .maestro/screenshots
          include-hidden-files: true
