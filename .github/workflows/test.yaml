name: test
on:
  push: { branches-ignore: [changesets-ghcommit-temp/**] } # cspell:ignore ghcommit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == 'main' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.ref_name != 'beta' || github.event.head_commit.distinct
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: false
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
      OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
      OPTIMISM_SEPOLIA_RPC_URL: ${{ secrets.OPTIMISM_SEPOLIA_RPC_URL }}
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true, filter: blob:none }
      - uses: actions/setup-node@v7
        with: { node-version: "^24.14.1" }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/svm
            /tmp/metro-cache
          key: deps-${{ runner.os }}-${{ github.job }}-${{ hashFiles('contracts/foundry.toml', 'pnpm-lock.yaml') }}
          restore-keys: deps-${{ runner.os }}-${{ github.job }}-
      - id: machine
        run: echo "id=$(cat /var/lib/dbus/machine-id /etc/machine-id 2> /dev/null | head -n 1)" >> "$GITHUB_OUTPUT" # cspell:ignore dbus
      - uses: actions/cache/restore@v6
        id: nx
        with:
          path: ~/.nx
          key: nx-${{ runner.os }}-${{ github.job }}-${{ steps.machine.outputs.id }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ github.job }}-${{ steps.machine.outputs.id }}-
      - run: pip install -r contracts/requirements.txt
      - run: echo ::add-matcher::.github/matcher.json
      - run: flock /tmp/apt.lock sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=5 install --update --no-install-recommends --yes redis-server > apt.log 2>&1 &
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: flock /tmp/apt.lock pnpm nx run-many -t test --parallel=$(git diff-tree --quiet "${NX_KEY##*-}" HEAD -- nx.json package.json pnpm-lock.yaml && echo 3 || echo 5)
        env: { NX_KEY: "${{ steps.nx.outputs.cache-matched-key }}" }
      - uses: actions/cache/save@v6
        if: github.ref_name == 'main'
        with: { path: ~/.nx, key: "${{ steps.nx.outputs.cache-primary-key }}" }

      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          disable_search: true
          exclude: node_modules
          plugins: noop
          files: contracts/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: contracts
          name: contracts
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          disable_search: true
          exclude: node_modules
          plugins: noop
          files: server/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: server
          name: server
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          report_type: test_results
          disable_search: true
          exclude: node_modules
          files: server/coverage/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: server
          name: server
      - if: ${{ !cancelled() }}
        run: echo "## [codecov](https://app.codecov.io/gh/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: server-artifacts
          path: |
            apt.log
            server/node_modules/@exactly/.*
          include-hidden-files: true

  e2e:
    if: github.ref_name != 'beta' || github.event.head_commit.distinct
    permissions: { actions: read, contents: read }
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flow: ach, method: webauthn, screen: 500x780 }
          - { flow: credit, method: webauthn, screen: 500x963 }
          - { flow: deposit, method: metamask, screen: 1920x1080 }
          - { flow: eth, method: brave, screen: 500x994 }
          - { flow: external, method: webauthn, screen: 600x608 }
          - { flow: onboarding, method: webauthn, screen: 500x1200 }
          - { flow: pix, method: webauthn, screen: 500x857 }
          - { flow: portfolio, method: webauthn, screen: 720x500 }
          - { flow: swap, method: webauthn, screen: 740x880 }
          - { flow: transfer, method: webauthn, screen: 760x600 }
    env:
      MAESTRO_CLI_NO_ANALYTICS: true
      NX_DAEMON: false
      NX_MAX_CACHE_SIZE: 1GB
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true, filter: blob:none }
      - uses: actions/setup-node@v7
        with: { node-version: "^24.14.1" }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1, cache: false }
      - id: script
        run: echo "hash=$(node -p 'require("./.maestro/package.json").scripts.maestro' | cat - .maestro/patches/*.patch | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with: { path: .maestro/build, key: "maestro-${{ runner.os }}-${{ steps.script.outputs.hash }}" }
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/svm
            /tmp/metro-cache
          key: dependencies-${{ runner.os }}-${{ github.job }}-${{ hashFiles('contracts/foundry.toml', 'pnpm-lock.yaml') }}
          restore-keys: dependencies-${{ runner.os }}-${{ github.job }}-
      - id: machine
        run: echo "id=$(cat /var/lib/dbus/machine-id /etc/machine-id 2> /dev/null | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: nx
        with:
          path: ~/.nx
          key: nx-${{ runner.os }}-${{ github.job }}-${{ steps.machine.outputs.id }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ github.job }}-${{ steps.machine.outputs.id }}-
      - run: echo ::add-matcher::.github/matcher.json
      - run: flock /tmp/apt.lock sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=5 install --update --no-install-recommends --yes redis-server > apt.log 2>&1 &
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: GITHUB_STEP_SUMMARY= flock /tmp/apt.lock pnpm nx e2e:web:release mobile > server.log 2>&1 &
      - if: github.ref_name == 'main'
        run: echo ${{ steps.script.outputs.hash }} | cmp -s - .maestro/build/hash || for run in $(gh run list -w maestro.yaml -c "$GITHUB_SHA" --json databaseId -q '.[].databaseId'); do timeout 600 gh run watch -i 10 "$run" > /dev/null || true; done
        env: { GH_TOKEN: "${{ github.token }}" }
      - if: matrix.method == 'metamask'
        id: metamask
        uses: actions/cache/restore@v6
        with:
          path: .maestro/node_modules/.cache/metamask
          key: metamask-${{ hashFiles('.maestro/package.json', '.maestro/subflows/metamask.yaml') }}
          restore-keys: metamask-
      - run: GITHUB_STEP_SUMMARY= pnpm nx e2e:${{ matrix.method }} e2e --flow=${{ matrix.flow }} --screen=${{ matrix.screen }} --skip-nx-cache
      - if: ${{ !cancelled() && matrix.method == 'metamask' && steps.metamask.outputs.cache-hit != 'true' && hashFiles('.maestro/node_modules/.cache/metamask/hash') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .maestro/node_modules/.cache/metamask
          key: ${{ steps.metamask.outputs.cache-primary-key }}
      - if: always()
        run: |
          curl -X POST http://localhost:3000/e2e/shutdown || true
          for i in {1..60}; do [ -f server/coverage/lcov.info ] && break; sleep 1; done
      - uses: actions/cache/save@v6
        if: github.ref_name == 'main'
        with: { path: ~/.nx, key: "${{ steps.nx.outputs.cache-primary-key }}" }
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          disable_search: true
          exclude: node_modules
          plugins: noop
          files: server/coverage/lcov.info,server/coverage/app.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: web
          name: ${{ matrix.flow }}
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          report_type: test_results
          disable_search: true
          exclude: node_modules
          files: .maestro/junit/${{ matrix.flow }}.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: web
          name: ${{ matrix.flow }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-${{ matrix.flow }}-artifacts
          path: |
            apt.log
            server.log
            .maestro/chrome.log
            server/coverage
            server/node_modules/@exactly/.*
            ~/.maestro/tests
            .maestro/screenshots
          include-hidden-files: true
