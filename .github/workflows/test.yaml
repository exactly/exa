name: test
on:
  push: { branches-ignore: [changesets-ghcommit-temp/**] } # cspell:ignore ghcommit
jobs:
  test:
    environment: test
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: false
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
      OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
      OPTIMISM_SEPOLIA_RPC_URL: ${{ secrets.OPTIMISM_SEPOLIA_RPC_URL }}
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-node@v7
        with: { node-version: "^24.14.1" }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - uses: actions/cache@v6
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: metro-${{ runner.os }}-${{ github.job }}-
      - uses: actions/cache@v6
        with:
          path: ~/.nx
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ github.job }}-
      - run: pip install -r contracts/requirements.txt
      - run: echo ::add-matcher::.github/matcher.json
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes redis-server
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t test

      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          disable_search: true
          files: contracts/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: contracts
          name: contracts
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          disable_search: true
          files: server/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: server
          name: server
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          report_type: test_results
          disable_search: true
          files: server/coverage/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: server
          name: server
      - if: ${{ !cancelled() }}
        run: echo "## [codecov](https://app.codecov.io/gh/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: server-artifacts
          path: server/node_modules/@exactly/.*
          include-hidden-files: true

  e2e:
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flow: credit, screen: 1920x1080 }
          - { flow: onboarding, screen: 500x1200 }
          - { flow: swap, screen: 740x880 }
          - { flow: transfer, screen: 760x600 }
    env:
      NX_DAEMON: false
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
      CHAIN_ID: "31337"
      EXPO_PUBLIC_E2E_MNEMONIC: ${{ secrets.EXPO_PUBLIC_E2E_MNEMONIC }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-node@v7
        with: { node-version: "^24.14.1" }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - uses: actions/cache@v6
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: metro-${{ runner.os }}-${{ github.job }}-
      - uses: actions/cache@v6
        with:
          path: ~/.nx
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ github.job }}-
      - uses: actions/cache@v6
        with:
          path: .maestro/build
          key: maestro-${{ runner.os }}-${{ hashFiles('.maestro/package.json', '.maestro/patches/*.patch') }}
      - run: echo ::add-matcher::.github/matcher.json
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes redis-server
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: GITHUB_STEP_SUMMARY= pnpm nx maestro e2e && echo "$PWD/.maestro/build/bin" >> "$GITHUB_PATH"
      - run: |
          GITHUB_STEP_SUMMARY= pnpm nx e2e:web:release mobile > server.log 2>&1 &
          for i in {1..420}; do
            curl -f http://localhost:3000/api/auth/authentication > /dev/null 2>&1 && curl -f http://localhost:8081 > /dev/null 2>&1 && break
            { [ $i -eq 420 ] || ! kill -0 $!; } && cat server.log && exit 1
            sleep 1
          done
          CHROME_LOG_FILE=$PWD/chrome.log maestro test .maestro/flows/web/${{ matrix.flow }}.yaml --format junit --output .maestro/junit.xml --headless --screen-size ${{ matrix.screen }} --browser-args=--force-prefers-reduced-motion
        env: { APP_DOMAIN: localhost, EXPO_PUBLIC_ENV: e2e }
      - if: always()
        run: |
          curl -X POST http://localhost:3000/e2e/shutdown || true
          for i in {1..60}; do [ -f server/coverage/lcov.info ] && break; sleep 1; done
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          disable_search: true
          files: server/coverage/lcov.info,server/coverage/app.json
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: e2e,web,siwe
          name: web
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          report_type: test_results
          disable_search: true
          files: .maestro/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: web
          name: web
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-${{ matrix.flow }}-artifacts
          path: |
            chrome.log
            server.log
            server/coverage
            server/node_modules/@exactly/.*
            ~/.maestro/tests
            .maestro/screenshots
          include-hidden-files: true
