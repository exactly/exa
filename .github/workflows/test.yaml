name: test
on: { push: {} }
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "^24.14.1" }
      - uses: actions/cache@v6
        id: deps
        with:
          path: |
            ~/.local/share/svm
            .maestro/build
            /tmp/metro-cache
          key: deps-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.maestro/package.json', '.maestro/patches/*.patch', 'contracts/foundry.toml', 'pnpm-lock.yaml') }}
          restore-keys: deps-${{ runner.os }}-${{ github.job }}-
      - uses: actions/cache@v6
        id: gradle
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.maestro/package.json') }}
          restore-keys: gradle-${{ runner.os }}-${{ github.job }}-
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - if: steps.gradle.outputs.cache-hit == 'true'
        run: |
          for h in repo.maven.apache.org repo1.maven.org plugins.gradle.org plugins-artifacts.gradle.org dl.google.com maven.google.com services.gradle.org; do printf '0.0.0.0 %s\n:: %s\n' $h $h; done | sudo tee -a /etc/hosts
          curl -sS -m 10 -o /dev/null https://plugins-artifacts.gradle.org/ && echo "NOT BLOCKED" || echo "blocked"
          find ~/.gradle -type f | wc -l
      - run: GITHUB_STEP_SUMMARY= pnpm nx maestro e2e && echo "$PWD/.maestro/build/bin" >> "$GITHUB_PATH"
      - run: find ~/.gradle/caches/modules-2 ~/.gradle/wrapper/dists -type f | wc -l && maestro --version
