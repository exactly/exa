name: beta
on: { workflow_dispatch: {} }
jobs:
  android_build:
    type: build
    params: { platform: android, profile: beta }

  android_submit:
    type: submit
    needs: [android_build]
    params: { build_id: "${{ needs.android_build.outputs.build_id }}", profile: beta }

  ios_build:
    type: build
    image: sdk-55
    params: { platform: ios, profile: beta }

  ios_submit:
    type: submit
    needs: [ios_build]
    params: { build_id: "${{ needs.ios_build.outputs.build_id }}", profile: beta }
