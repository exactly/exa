name: passkey probe
on: { workflow_dispatch: {} }
defaults: { tools: { node: "24.14.1", pnpm: "10.33.0" } }
concurrency: { cancel_in_progress: true, group: "${{ workflow.filename }}-${{ github.ref }}" }
jobs:
  pearl:
    environment: development
    runs_on: macos-large
    image: latest
    env: { NOTIFICATION: com.apple.BiometricKit_Sim.pearl.match }
    steps: &steps
      - uses: eas/checkout
      - uses: eas/install_maestro
      - uses: eas/download_build
        id: download
        with: { build_id: d44c09d7-2240-4681-88dd-5715fb71d6a5 }
      - uses: eas/start_ios_simulator
      - name: prepare device
        run: |
          xcrun simctl spawn booted defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
          xcrun simctl spawn booted notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
          xcrun simctl spawn booted notifyutil -p com.apple.BiometricKit.enrollmentChanged
          xcrun simctl install booted "${{ steps.download.outputs.artifact_path }}"
          xcrun simctl spawn booted log stream --level info --predicate 'process == "Exa" or process CONTAINS "AuthenticationServices" or subsystem CONTAINS "BiometricKit" or subsystem CONTAINS "LocalAuthentication"' > simulator.log 2>&1 &
          (until [ -n "$(find .maestro -name faceid.png)" ]; do sleep 1; done; sleep 2; date; xcrun simctl spawn booted notifyutil -p "$NOTIFICATION") > notify.log 2>&1 &
      - run: maestro test .maestro/passkey.yaml
      - name: probe teardown
        if: always()
        run: |
          xcrun simctl io booted screenshot final.png || true
          pkill -f "log stream" || true # cspell:ignore pkill
      - uses: eas/upload_artifact
        if: always()
        with:
          type: other
          ignore_error: true
          path: |
            final.png
            notify.log
            simulator.log
            ${{ env.HOME }}/.maestro/tests
            .maestro/screenshots
  finger:
    environment: development
    runs_on: macos-large
    image: latest
    env: { NOTIFICATION: com.apple.BiometricKit_Sim.fingerTouch.match }
    steps: *steps
