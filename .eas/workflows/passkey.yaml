name: passkey probe
on: { workflow_dispatch: {} }
defaults: { tools: { node: "24.14.1", pnpm: "10.33.0" } }
concurrency: { cancel_in_progress: true, group: "${{ workflow.filename }}-${{ github.ref }}" }
jobs:
  ios:
    environment: development
    runs_on: macos-large
    image: latest
    steps:
      - uses: eas/checkout
      - name: install patched maestro
        run: |
          gh --version || true
          curl -sSL --fail-with-body -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/exactly/exa/actions/artifacts?name=maestro-$(git hash-object patches/maestro.patch)&per_page=1" | tee /dev/stderr |
            node -p "JSON.parse(require('fs').readFileSync(0)).artifacts[0].archive_download_url" |
            xargs curl -sSL --fail-with-body -H "Authorization: Bearer $GITHUB_TOKEN" -o "$TMPDIR/artifact.zip"
          unzip -q "$TMPDIR/artifact.zip" -d "$TMPDIR" && unzip -q "$TMPDIR/maestro.zip" -d "$TMPDIR"
          rm -rf "$HOME/.maestro/bin" "$HOME/.maestro/lib" && mv "$TMPDIR/maestro/bin" "$TMPDIR/maestro/lib" "$HOME/.maestro/"
          maestro --version
      - uses: eas/download_build
        id: download
        with: { build_id: d44c09d7-2240-4681-88dd-5715fb71d6a5 }
      - uses: eas/start_ios_simulator
      - name: prepare device
        run: |
          xcrun simctl spawn booted defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
          xcrun simctl install booted "${{ steps.download.outputs.artifact_path }}"
          xcrun simctl spawn booted log stream --level info --predicate 'process == "Exa" or process CONTAINS "AuthenticationServices" or subsystem CONTAINS "BiometricKit" or subsystem CONTAINS "LocalAuthentication"' > simulator.log 2>&1 &
      - run: maestro test .maestro/passkey.yaml
      - name: probe teardown
        if: always()
        run: |
          xcrun simctl io booted screenshot final.png || true
          pkill -f "log stream" || true # cspell:ignore pkill
      - uses: eas/upload_artifact
        if: always()
        with:
          type: other
          ignore_error: true
          path: |
            final.png
            simulator.log
            ${{ env.HOME }}/.maestro/tests
