name: e2e:local
on:
  push: { branches: ["main"], tags: ["@exactly/mobile@*"] }
  pull_request: { if: "!github.event.pull_request.draft", types: [opened, ready_for_review, reopened, synchronize] }
  workflow_dispatch: {}
defaults:
  tools: { node: "24.14.1" }
  hooks: { before_install_node_modules: [{ run: corepack enable }] }
concurrency:
  cancel_in_progress: "${{ github.ref_name != 'main' }}"
  group: "${{ workflow.filename }}-${{ github.ref }}"
jobs:
  fingerprint:
    environment: development
    env: { APP_DOMAIN: localhost }
    outputs:
      android_fingerprint_hash: ${{ steps.fingerprint.outputs.android }}
      ios_fingerprint_hash: ${{ steps.fingerprint.outputs.ios }}
    steps:
      - uses: eas/checkout
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm nx generate:version mobile
      - id: fingerprint
        run: |
          for platform in android ios; do
            set-output $platform "$(pnpm exec fingerprint fingerprint:generate --platform $platform | node -p 'JSON.parse(require("fs").readFileSync(0)).hash')"
          done

  android_get:
    if: ${{ github.ref_type != 'tag' }}
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      profile: e2e:local
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  android_build:
    type: build
    needs: [fingerprint]
    after: [android_get]
    if: ${{ !after.android_get.outputs.build_id }}
    params: { platform: android, profile: e2e:local }

  android_e2e:
    after: [android_get, android_build]
    if: ${{ after.android_get.outputs.build_id || after.android_build.status == 'success' }}
    environment: development
    runs_on: linux-large-nested-virtualization
    image: latest
    env:
      APP_DOMAIN: localhost
      CHAIN_ID: "31337"
      EXPO_PUBLIC_ENV: e2e
      GIT_BRANCH: "${{ github.ref_name }}"
      MAESTRO_CLI_NO_ANALYTICS: "true"
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
    steps:
      - uses: eas/checkout
      - run: flock /tmp/apt.lock sudo sh -c "apt-get update && apt-get install --no-install-recommends --yes redis-server" > apt.log 2>&1 &
      - name: start emulators # cspell:ignore avdmanager sdkmanager setsid swangle
        run: |
          sdkmanager --install "system-images;android-"{33,34,35,36}";google_apis;x86_64" > /dev/null
          for device in 5554:33:412:915 5556:34:320:640 5558:35:600:960 5560:36:673:841; do
            IFS=: read -r port api width height <<< "$device"
            avdmanager -s create avd -n "e2e$port" -k "system-images;android-$api;google_apis;x86_64" --force
            printf '%s\n' "hw.ramSize=4096" "vm.heapSize=1024" "hw.lcd.width=$width" "hw.lcd.height=$height" "hw.lcd.density=160" "hw.mainKeys=no" >> "$HOME/.android/avd/e2e$port.avd/config.ini"
            setsid $ANDROID_HOME/emulator/emulator -avd "e2e$port" -port "$port" -no-snapshot -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swangle -memory 4096 -wipe-data > "emulator-process-$port.log" 2>&1 &
            echo "emulator-$port" >> emulators.serial
          done
      - uses: eas/restore_cache
        if: ${{ github.ref_type != 'tag' }}
        with: { key: "nx-android-e2e-${{ github.sha }}", restore_keys: nx-android-e2e-, path: nx.tar }
      - run: tar -xf nx.tar -C ~ || true
      - uses: eas/install_node_modules
      - if: ${{ github.ref_name == 'main' }}
        run: tar -cf nx.tar -C ~ .nx
      - uses: eas/save_cache
        if: ${{ github.ref_name == 'main' }}
        with: { key: "nx-android-e2e-${{ github.sha }}", path: nx.tar }
      - name: exa setup
        run: flock /tmp/apt.lock pnpm nx e2e server > server.log 2>&1 &
      - id: script
        run: set-output hash "$(node -p 'require("./.maestro/package.json").scripts.maestro' | git hash-object --stdin)"
      - uses: eas/restore_cache
        id: maestro
        with:
          key: "maestro-${{ steps.script.outputs.hash }}-${{ hashFiles('.maestro/patches/*.patch') }}"
          path: .maestro/build
      - uses: eas/restore_cache
        id: gradle
        if: ${{ steps.maestro.outputs.cache_hit != 'true' }}
        with:
          key: "gradle-${{ steps.script.outputs.hash }}"
          restore_keys: gradle-
          path: | # cspell:ignore dists
            .maestro/.gradle/caches/modules-2
            .maestro/.gradle/wrapper/dists
      - run: GRADLE_USER_HOME=$PWD/.maestro/.gradle pnpm nx maestro e2e && set-env PATH "$PWD/.maestro/build/bin:$PATH"
      - uses: eas/save_cache
        if: ${{ steps.maestro.outputs.cache_hit != 'true' }}
        with:
          key: "maestro-${{ steps.script.outputs.hash }}-${{ hashFiles('.maestro/patches/*.patch') }}"
          path: .maestro/build
      - uses: eas/save_cache
        if: ${{ steps.maestro.outputs.cache_hit != 'true' && steps.gradle.outputs.cache_hit != 'true' }}
        with:
          key: "gradle-${{ steps.script.outputs.hash }}"
          path: |
            .maestro/.gradle/caches/modules-2
            .maestro/.gradle/wrapper/dists
      - uses: eas/download_build
        id: download
        with: { build_id: "${{ after.android_get.outputs.build_id || after.android_build.outputs.build_id }}" }
      - uses: eas/repack
        id: repack
        with: { platform: android, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - name: prepare devices # cspell:ignore getprop logcat
        run: |
          for device in $(cat emulators.serial); do
            timeout 180 adb -s "$device" wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            adb -s "$device" shell settings put global window_animation_scale 0
            adb -s "$device" shell settings put global transition_animation_scale 0
            adb -s "$device" shell settings put global animator_duration_scale 0
            overlay="cmd overlay enable-exclusive --category com.android.internal"
            case $device in # cspell:ignore esac gestural systemui threebutton
              emulator-5554) adb -s "$device" shell "$overlay.systemui.navbar.threebutton && settings put system font_scale 1.3" ;;
              emulator-5556) adb -s "$device" shell "$overlay.systemui.navbar.gestural && $overlay.display.cutout.emulation.tall" ;;
              emulator-5558) adb -s "$device" shell "$overlay.systemui.navbar.threebutton" ;;
              emulator-5560) adb -s "$device" shell "$overlay.systemui.navbar.gestural" ;;
            esac
            for tcp in 3000 8545 8969 9944; do adb -s "$device" reverse "tcp:$tcp" "tcp:$tcp"; done
            adb -s "$device" install "${{ steps.repack.outputs.output_path }}"
            adb -s "$device" logcat -v time > "$device.log" 2>&1 &
          done
          for i in {1..420}; do
            curl -f http://localhost:3000/api/auth/authentication > /dev/null 2>&1 && break
            [ $i -eq 420 ] && echo "health check timed out" && cat server.log && exit 1
            sleep 1
          done
      - run: pnpm e2e:maestro --device $(paste -sd, emulators.serial) --shard-split $(wc -l < emulators.serial) --format junit --output .maestro/junit.xml
      - name: exa teardown
        if: always()
        run: | # cspell:ignore pgrep pkill
          curl -X POST http://localhost:3000/e2e/shutdown || true
          for i in {1..60}; do [ -f server/coverage/lcov.info ] && break; sleep 1; done
          curl -Os https://cli.codecov.io/latest/linux/codecov && chmod +x codecov
          ./codecov upload-coverage --disable-search -f server/coverage/lcov.info -f server/coverage/app.lcov -F android -n android --build-url ${{ workflow.url }} --git-service github &
          ./codecov do-upload --report-type test_results --disable-search -f .maestro/junit.xml -F android -n android --build-url ${{ workflow.url }} --git-service github
          wait $!
          pkill -f "adb logcat" || true
          for device in $(cat emulators.serial); do adb -s "$device" emu kill || true; done
          for i in {1..30}; do pgrep -f qemu-system > /dev/null || break; sleep 1; done
      - uses: eas/upload_artifact
        if: always()
        with:
          type: other
          ignore_error: true
          path: |
            apt.log
            server.log
            server/coverage
            server/node_modules/@exactly/.*
            emulator-*.log
            ${{ env.HOME }}/.maestro/tests
            .maestro/screenshots

  ios_get:
    if: ${{ github.ref_type != 'tag' }}
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: e2e:local
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  ios_build:
    type: build
    needs: [fingerprint]
    after: [ios_get]
    if: ${{ !after.ios_get.outputs.build_id }}
    image: sdk-55
    params: { platform: ios, profile: e2e:local }

  ios_e2e:
    after: [ios_get, ios_build]
    if: ${{ after.ios_get.outputs.build_id || after.ios_build.status == 'success' }}
    environment: development
    runs_on: macos-large
    image: latest
    env:
      APP_DOMAIN: localhost
      CHAIN_ID: "31337"
      EXPO_PUBLIC_ENV: e2e
      GIT_BRANCH: "${{ github.ref_name }}"
      MAESTRO_CLI_NO_ANALYTICS: "true"
      REDISMS_SYSTEM_BINARY: /opt/homebrew/bin/redis-server
      SHARP_IGNORE_GLOBAL_LIBVIPS: "true" # cspell:ignore libvips
    steps:
      - run: brew install redis
      - uses: eas/checkout
      - uses: eas/restore_cache
        if: ${{ github.ref_type != 'tag' }}
        with: { key: "nx-ios-e2e-${{ github.sha }}", restore_keys: nx-ios-e2e-, path: nx.tar }
      - run: tar -xf nx.tar -C ~ || true
      - uses: eas/restore_cache
        id: modules
        if: ${{ github.ref_type != 'tag' }}
        with: { key: "modules-${{ hashFiles('pnpm-lock.yaml') }}", restore_keys: modules-, path: modules.tar }
      - run: tar -xPf modules.tar || true
      - uses: eas/install_node_modules
      - if: ${{ github.ref_name == 'main' }}
        run: tar -cf nx.tar -C ~ .nx
      - uses: eas/save_cache
        if: ${{ github.ref_name == 'main' }}
        with: { key: "nx-ios-e2e-${{ github.sha }}", path: nx.tar }
      - if: ${{ github.ref_name == 'main' && steps.modules.outputs.cache_hit != 'true' }}
        run: tar -cPf modules.tar node_modules */node_modules .maestro/node_modules ~/Library/Caches/pnpm/lockfile-verified.jsonl
      - uses: eas/save_cache
        if: ${{ github.ref_name == 'main' && steps.modules.outputs.cache_hit != 'true' }}
        with: { key: "modules-${{ hashFiles('pnpm-lock.yaml') }}", path: modules.tar }
      - name: exa setup
        run: pnpm nx e2e server > server.log 2>&1 &
      - id: script
        run: set-output hash "$(node -p 'require("./.maestro/package.json").scripts.maestro' | git hash-object --stdin)"
      - uses: eas/restore_cache
        id: maestro
        with:
          key: "maestro-${{ steps.script.outputs.hash }}-${{ hashFiles('.maestro/patches/*.patch') }}"
          path: .maestro/build
      - uses: eas/restore_cache
        id: gradle
        if: ${{ steps.maestro.outputs.cache_hit != 'true' }}
        with:
          key: "gradle-${{ steps.script.outputs.hash }}"
          restore_keys: gradle-
          path: | # cspell:ignore dists
            .maestro/.gradle/caches/modules-2
            .maestro/.gradle/wrapper/dists
      - run: GRADLE_USER_HOME=$PWD/.maestro/.gradle pnpm nx maestro e2e && set-env PATH "$PWD/.maestro/build/bin:$PATH"
      - uses: eas/save_cache
        if: ${{ steps.maestro.outputs.cache_hit != 'true' }}
        with:
          key: "maestro-${{ steps.script.outputs.hash }}-${{ hashFiles('.maestro/patches/*.patch') }}"
          path: .maestro/build
      - uses: eas/save_cache
        if: ${{ steps.maestro.outputs.cache_hit != 'true' && steps.gradle.outputs.cache_hit != 'true' }}
        with:
          key: "gradle-${{ steps.script.outputs.hash }}"
          path: |
            .maestro/.gradle/caches/modules-2
            .maestro/.gradle/wrapper/dists
      - uses: eas/download_build
        id: download
        with: { build_id: "${{ after.ios_get.outputs.build_id || after.ios_build.outputs.build_id }}" }
      - uses: eas/repack
        id: repack
        with: { platform: ios, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - name: start simulators # cspell:ignore bootstatus datamigrator UICT udid
        run: |
          for i in 1 2 3 4; do xcrun simctl create "e2e$i" "iPhone SE (3rd generation)" >> simulators.udid; done
          for udid in $(cat simulators.udid); do
            mkdir -p -m 700 "/private/var/tmp/com.apple.CoreSimulator.SimDevice.$udid"
            cp .eas/disabled.plist "/private/var/tmp/com.apple.CoreSimulator.SimDevice.$udid/"
            {
              xcrun simctl bootstatus "$udid" -b > /dev/null
              for i in {1..180}; do xcrun simctl io "$udid" screenshot "$udid.png" > /dev/null 2>&1 && break; [ $i -eq 180 ] && exit 1; sleep 1; done
              xcrun simctl spawn "$udid" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
              touch "$udid.ready"
            } > "simulator-$udid-boot.log" 2>&1 &
          done
          for i in {1..300}; do [ -z "$(jobs -rp)" ] && break; sleep 1; done
          for udid in $(cat simulators.udid); do [ -f "$udid.ready" ] || { echo "simulator $udid failed to start" && exit 1; }; done
          for i in {1..300}; do pgrep -f com.apple.datamigrator > /dev/null || break; sleep 1; done
          xcrun simctl spawn "$(sed -n 3p simulators.udid)" defaults write com.apple.UIKit UIPreferredContentSizeCategoryName UICTContentSizeCategoryXXXL
      - name: prepare devices
        run: |
          for udid in $(cat simulators.udid); do
            xcrun simctl install "$udid" "${{ steps.repack.outputs.output_path }}"
            xcrun simctl spawn "$udid" log stream --predicate 'subsystem contains "app.exactly" or process == "Exa"' > "simulator-$udid.log" 2>&1 &
          done
          for i in {1..420}; do
            curl -f http://localhost:3000/api/auth/authentication > /dev/null 2>&1 && break
            [ $i -eq 420 ] && echo "health check timed out" && cat server.log && exit 1
            sleep 1
          done
      - run: pnpm e2e:maestro --shard-split $(wc -l < simulators.udid) --format junit --output .maestro/junit.xml
      - name: exa teardown
        if: always()
        run: | # cspell:ignore pkill
          curl -X POST http://localhost:3000/e2e/shutdown || true
          for i in {1..60}; do [ -f server/coverage/lcov.info ] && break; sleep 1; done
          curl -Os https://cli.codecov.io/latest/macos/codecov && chmod +x codecov
          ./codecov upload-coverage --disable-search -f server/coverage/lcov.info -f server/coverage/app.lcov -F ios -n ios --build-url ${{ workflow.url }} --git-service github &
          ./codecov do-upload --report-type test_results --disable-search -f .maestro/junit.xml -F ios -n ios --build-url ${{ workflow.url }} --git-service github
          wait $!
          pkill -f "log stream" || true
          xcrun simctl diagnose -b --no-archive --output=simulator-diagnose || true
      - uses: eas/upload_artifact
        if: always()
        with:
          type: other
          ignore_error: true
          path: |
            server.log
            server/coverage
            server/node_modules/@exactly/.*
            simulator-*.log
            simulator-diagnose
            ${{ env.HOME }}/.maestro/tests
            .maestro/screenshots
