name: e2e:local
on:
  push: { branches: ["main"], tags: ["@exactly/mobile@*"] }
  pull_request: { if: "!github.event.pull_request.draft", types: [opened, ready_for_review, reopened, synchronize] }
  workflow_dispatch: {}
defaults: { tools: { node: "24.14.1", pnpm: "10.33.0" } }
concurrency:
  cancel_in_progress: "${{ github.ref_name != 'main' }}"
  group: "${{ workflow.filename }}-${{ github.ref }}"
jobs:
  fingerprint:
    type: fingerprint
    environment: development
    env: { APP_DOMAIN: localhost }

  android_get:
    if: ${{ github.ref_type != 'tag' }}
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      profile: e2e:local
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  android_build:
    type: build
    needs: [fingerprint]
    after: [android_get]
    if: ${{ !after.android_get.outputs.build_id }}
    params: { platform: android, profile: e2e:local }

  android_e2e:
    after: [android_get, android_build]
    if: ${{ after.android_get.outputs.build_id || after.android_build.status == 'success' }}
    environment: development
    runs_on: linux-large-nested-virtualization
    image: latest
    env:
      APP_DOMAIN: localhost
      CHAIN_ID: "31337"
      EXPO_PUBLIC_ENV: e2e
      GIT_BRANCH: "${{ github.ref_name }}"
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
    steps:
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes redis-server
      - uses: eas/checkout
      - name: start emulators # cspell:ignore avdmanager setsid swiftshader
        run: |
          for port in 5554 5556 5558 5560; do
            avdmanager -s create avd -n "e2e$port" -k "system-images;android-32;google_apis;x86_64" --force
            printf '%s\n' "hw.ramSize=4096" "vm.heapSize=1024" >> "$HOME/.android/avd/e2e$port.avd/config.ini"
            setsid $ANDROID_HOME/emulator/emulator -avd "e2e$port" -port "$port" -no-snapshot -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096 -wipe-data > "emulator-process-$port.log" 2>&1 &
          done
      - uses: eas/restore_cache
        if: ${{ github.ref_type != 'tag' }}
        with: { key: "nx-android-e2e-${{ github.sha }}", restore_keys: nx-android-e2e-, path: nx.tar }
      - run: tar -xf nx.tar -C ~ || true
      - uses: eas/install_node_modules
      - run: tar -cf nx.tar -C ~ .nx
      - uses: eas/save_cache
        if: ${{ github.ref_type != 'tag' }}
        with: { key: "nx-android-e2e-${{ github.sha }}", path: nx.tar }
      - name: exa setup
        run: pnpm nx e2e server > server.log 2>&1 &
      - uses: eas/restore_cache
        id: maestro
        with:
          key: "maestro-${{ hashFiles('.maestro/package.json', '.maestro/patches/*.patch') }}"
          path: .maestro/build
      - run: GRADLE_USER_HOME=$(mktemp -d) pnpm nx maestro e2e && set-env PATH "$PWD/.maestro/build/bin:$PATH"
      - uses: eas/save_cache
        if: ${{ steps.maestro.outputs.cache_hit != 'true' }}
        with:
          key: "maestro-${{ hashFiles('.maestro/package.json', '.maestro/patches/*.patch') }}"
          path: .maestro/build
      - name: generate accounts
        run: for flow in credit onboarding swap transfer; do node -p 'const { english, generateMnemonic } = require("viem/accounts"); generateMnemonic(english)' > "$flow.mnemonic"; done
      - uses: eas/download_build
        id: download
        with: { build_id: "${{ after.android_get.outputs.build_id || after.android_build.outputs.build_id }}" }
      - run: set-env EXPO_PUBLIC_E2E_MNEMONIC "$(cat credit.mnemonic)"
      - uses: eas/repack
        id: credit
        with: { platform: android, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - run: set-env EXPO_PUBLIC_E2E_MNEMONIC "$(cat onboarding.mnemonic)"
      - uses: eas/repack
        id: onboarding
        with: { platform: android, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - run: set-env EXPO_PUBLIC_E2E_MNEMONIC "$(cat swap.mnemonic)"
      - uses: eas/repack
        id: swap
        with: { platform: android, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - run: set-env EXPO_PUBLIC_E2E_MNEMONIC "$(cat transfer.mnemonic)"
      - uses: eas/repack
        id: transfer
        with: { platform: android, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - name: prepare devices # cspell:ignore getprop logcat
        run: |
          set -- "${{ steps.credit.outputs.output_path }}" "${{ steps.onboarding.outputs.output_path }}" "${{ steps.swap.outputs.output_path }}" "${{ steps.transfer.outputs.output_path }}"
          for port in 5554 5556 5558 5560; do
            adb -s "emulator-$port" wait-for-device
            timeout 180 adb -s "emulator-$port" shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            adb -s "emulator-$port" shell settings put global window_animation_scale 0
            adb -s "emulator-$port" shell settings put global transition_animation_scale 0
            adb -s "emulator-$port" shell settings put global animator_duration_scale 0
            adb -s "emulator-$port" reverse tcp:3000 tcp:3000 && adb -s "emulator-$port" reverse tcp:8545 tcp:8545 && adb -s "emulator-$port" reverse tcp:8969 tcp:8969
            adb -s "emulator-$port" install "$1" && shift
            adb -s "emulator-$port" logcat -v time > "emulator-$port.log" 2>&1 &
          done
          for i in {1..420}; do
            curl -f http://localhost:3000/api/auth/authentication > /dev/null 2>&1 && break
            [ $i -eq 420 ] && echo "health check timed out" && cat server.log && exit 1
            sleep 1
          done
      - name: maestro
        run: |
          port=5554
          for flow in credit onboarding swap transfer; do
            maestro test --device "emulator-$port" ".maestro/flows/$flow.yaml" -e "EXPO_PUBLIC_E2E_MNEMONIC=$(cat "$flow.mnemonic")" --format junit --output ".maestro/junit-$flow.xml" --debug-output "$HOME/.maestro/tests/$flow" > >(awk -v flow="$flow" '{ print "[" flow "] " $0; fflush() }') 2>&1 &
            pids="$pids $!"
            port=$((port + 2))
          done
          status=0
          for pid in $pids; do wait "$pid" || status=1; done
          exit "$status"
      - name: exa teardown
        if: always()
        run: | # cspell:ignore pkill
          curl -X POST http://localhost:3000/e2e/shutdown || true
          for i in {1..60}; do [ -f server/coverage/lcov.info ] && break; sleep 1; done
          curl -Os https://cli.codecov.io/latest/linux/codecov && chmod +x codecov
          ./codecov upload-coverage -f server/coverage/lcov.info -f server/coverage/app.json -F android -n android --build-url ${{ workflow.url }} --git-service github
          ./codecov do-upload --report-type test_results --disable-search $(printf -- "-f %s " .maestro/junit-*.xml) -F android -n android --build-url ${{ workflow.url }} --git-service github
          pkill -f "adb logcat" || true
      - uses: eas/upload_artifact
        if: always()
        with:
          type: other
          ignore_error: true
          path: |
            server.log
            server/coverage
            server/node_modules/@exactly/.*
            emulator-*.log
            emulator-process-*.log
            ${{ env.HOME }}/.maestro/tests
            .maestro/screenshots

  ios_get:
    if: ${{ github.ref_type != 'tag' }}
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: e2e:local
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  ios_build:
    type: build
    needs: [fingerprint]
    after: [ios_get]
    if: ${{ !after.ios_get.outputs.build_id }}
    params: { platform: ios, profile: e2e:local }

  ios_e2e:
    after: [ios_get, ios_build]
    if: ${{ after.ios_get.outputs.build_id || after.ios_build.status == 'success' }}
    environment: development
    runs_on: macos-large
    image: latest
    env:
      APP_DOMAIN: localhost
      CHAIN_ID: "31337"
      EXPO_PUBLIC_ENV: e2e
      GIT_BRANCH: "${{ github.ref_name }}"
      REDISMS_SYSTEM_BINARY: /opt/homebrew/bin/redis-server
    steps:
      - run: brew install redis
      - uses: eas/checkout
      - uses: eas/restore_cache
        if: ${{ github.ref_type != 'tag' }}
        with: { key: "nx-ios-e2e-${{ github.sha }}", restore_keys: nx-ios-e2e-, path: nx.tar }
      - run: tar -xf nx.tar -C ~ || true
      - uses: eas/install_node_modules
      - run: tar -cf nx.tar -C ~ .nx
      - uses: eas/save_cache
        if: ${{ github.ref_type != 'tag' }}
        with: { key: "nx-ios-e2e-${{ github.sha }}", path: nx.tar }
      - name: exa setup
        run: pnpm nx e2e server > server.log 2>&1 &
      - uses: eas/restore_cache
        id: maestro
        with:
          key: "maestro-${{ hashFiles('.maestro/package.json', '.maestro/patches/*.patch') }}"
          path: .maestro/build
      - run: GRADLE_USER_HOME=$(mktemp -d) pnpm nx maestro e2e && set-env PATH "$PWD/.maestro/build/bin:$PATH"
      - uses: eas/save_cache
        if: ${{ steps.maestro.outputs.cache_hit != 'true' }}
        with:
          key: "maestro-${{ hashFiles('.maestro/package.json', '.maestro/patches/*.patch') }}"
          path: .maestro/build
      - name: generate accounts
        run: for flow in credit onboarding swap transfer; do node -p 'const { english, generateMnemonic } = require("viem/accounts"); generateMnemonic(english)' > "$flow.mnemonic"; done
      - uses: eas/download_build
        id: download
        with: { build_id: "${{ after.ios_get.outputs.build_id || after.ios_build.outputs.build_id }}" }
      - run: set-env EXPO_PUBLIC_E2E_MNEMONIC "$(cat credit.mnemonic)"
      - uses: eas/repack
        id: credit
        with: { platform: ios, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - run: set-env EXPO_PUBLIC_E2E_MNEMONIC "$(cat onboarding.mnemonic)"
      - uses: eas/repack
        id: onboarding
        with: { platform: ios, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - run: set-env EXPO_PUBLIC_E2E_MNEMONIC "$(cat swap.mnemonic)"
      - uses: eas/repack
        id: swap
        with: { platform: ios, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - run: set-env EXPO_PUBLIC_E2E_MNEMONIC "$(cat transfer.mnemonic)"
      - uses: eas/repack
        id: transfer
        with: { platform: ios, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - name: start simulators # cspell:ignore apsd bootout bootstatus datamigrator
        run: |
          source=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | min_by(.name | length) | .udid')
          for flow in credit onboarding swap transfer; do
            xcrun simctl clone "$source" "e2e-$flow" > /dev/null
            xcrun simctl list devices -j | jq -r --arg name "e2e-$flow" '.devices[][] | select(.name == $name) | .udid' > "$flow.udid"
            echo "cloned $flow"
          done
          for flow in credit onboarding swap transfer; do
            {
              udid=$(cat "$flow.udid")
              xcrun simctl bootstatus "$udid" -b > /dev/null
              xcrun simctl spawn "$udid" launchctl disable user/foreground/com.apple.apsd
              xcrun simctl spawn "$udid" launchctl bootout user/foreground/com.apple.apsd || true
              until xcrun simctl io "$udid" screenshot "$flow.png" > /dev/null 2>&1; do sleep 1; done
              echo "booted $flow"
            } &
          done
          wait
          while ps -eo comm | grep -q com.apple.datamigrator; do sleep 1; done
          echo "ready"
      - name: prepare devices
        run: |
          set -- "${{ steps.credit.outputs.output_path }}" "${{ steps.onboarding.outputs.output_path }}" "${{ steps.swap.outputs.output_path }}" "${{ steps.transfer.outputs.output_path }}"
          for flow in credit onboarding swap transfer; do
            udid=$(cat "$flow.udid")
            xcrun simctl spawn "$udid" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
            xcrun simctl install "$udid" "$1" && shift
            xcrun simctl spawn "$udid" log stream --predicate 'subsystem contains "app.exactly" or process == "Exa"' > "simulator-$flow.log" 2>&1 &
          done
          for i in {1..420}; do
            curl -f http://localhost:3000/api/auth/authentication > /dev/null 2>&1 && break
            [ $i -eq 420 ] && echo "health check timed out" && cat server.log && exit 1
            sleep 1
          done
      - name: maestro
        run: |
          for flow in credit onboarding swap transfer; do
            maestro test --device "$(cat "$flow.udid")" ".maestro/flows/$flow.yaml" -e "EXPO_PUBLIC_E2E_MNEMONIC=$(cat "$flow.mnemonic")" --format junit --output ".maestro/junit-$flow.xml" --debug-output "$HOME/.maestro/tests/$flow" > >(awk -v flow="$flow" '{ print "[" flow "] " $0; fflush() }') 2>&1 &
            pids="$pids $!"
          done
          status=0
          for pid in $pids; do wait "$pid" || status=1; done
          exit "$status"
      - name: exa teardown
        if: always()
        run: | # cspell:ignore pkill
          curl -X POST http://localhost:3000/e2e/shutdown || true
          for i in {1..60}; do [ -f server/coverage/lcov.info ] && break; sleep 1; done
          curl -Os https://cli.codecov.io/latest/macos/codecov && chmod +x codecov
          ./codecov upload-coverage -f server/coverage/lcov.info -f server/coverage/app.json -F ios -n ios --build-url ${{ workflow.url }} --git-service github
          ./codecov do-upload --report-type test_results --disable-search $(printf -- "-f %s " .maestro/junit-*.xml) -F ios -n ios --build-url ${{ workflow.url }} --git-service github
          pkill -f "log stream" || true
          xcrun simctl diagnose -b --no-archive --output=simulator-diagnose || true
      - uses: eas/upload_artifact
        if: always()
        with:
          type: other
          ignore_error: true
          path: |
            server.log
            server/coverage
            server/node_modules/@exactly/.*
            simulator-*.log
            simulator-diagnose
            ${{ env.HOME }}/.maestro/tests
            .maestro/screenshots
