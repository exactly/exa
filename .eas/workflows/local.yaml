name: e2e:local
on:
  push: { branches: ["main"], tags: ["@exactly/mobile@*"] }
  pull_request: { if: "!github.event.pull_request.draft", types: [opened, ready_for_review, reopened, synchronize] }
  workflow_dispatch: {}
defaults: { tools: { node: "24.14.1" } }
concurrency:
  cancel_in_progress: "${{ github.ref_name != 'main' }}"
  group: "${{ workflow.filename }}-${{ github.ref }}"
jobs:
  fingerprint:
    environment: development
    env: { APP_DOMAIN: localhost }
    outputs:
      android_fingerprint_hash: ${{ steps.fingerprint.outputs.android }}
      ios_fingerprint_hash: ${{ steps.fingerprint.outputs.ios }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: fingerprint
        run: |
          set-output android "$(pnpm exec fingerprint fingerprint:generate --platform android | node -p 'JSON.parse(require("fs").readFileSync(0)).hash')"
          set-output ios "$(APP_DOMAIN=sandbox.exactly.app APPLE_TEAM_ID=665NDX7LBZ pnpm exec fingerprint fingerprint:generate --platform ios | node -p 'JSON.parse(require("fs").readFileSync(0)).hash')"

  android_get:
    if: ${{ github.ref_type != 'tag' }}
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      profile: e2e:local
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  android_build:
    type: build
    needs: [fingerprint]
    after: [android_get]
    if: ${{ !after.android_get.outputs.build_id }}
    params: { platform: android, profile: e2e:local }

  android_e2e:
    after: [android_get, android_build]
    if: ${{ after.android_get.outputs.build_id || after.android_build.status == 'success' }}
    environment: development
    runs_on: linux-large-nested-virtualization
    image: latest
    env:
      APP_DOMAIN: sandbox.exactly.app
      CHAIN_ID: "31337"
      EXPO_PUBLIC_ENV: e2e
      GIT_BRANCH: "${{ github.ref_name }}"
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
    steps:
      - uses: eas/checkout
      - run: flock /tmp/apt.lock sudo sh -c "apt-get update && apt-get install --no-install-recommends --yes redis-server" > apt.log 2>&1 &
      - name: start emulator # cspell:ignore avdmanager sdkmanager setsid swangle
        run: |
          sdkmanager --install "system-images;android-35;google_apis;x86_64" > /dev/null
          avdmanager -s create avd -n e2e -k "system-images;android-35;google_apis;x86_64" --force
          printf '%s\n' "hw.ramSize=8192" "vm.heapSize=1024" >> $HOME/.android/avd/e2e.avd/config.ini
          setsid $ANDROID_HOME/emulator/emulator -avd e2e -no-snapshot -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swangle -memory 8192 -wipe-data > emulator-process.log 2>&1 &
      - uses: eas/restore_cache
        if: ${{ github.ref_type != 'tag' }}
        with: { key: "nx-android-e2e-${{ github.sha }}", restore_keys: nx-android-e2e-, path: nx.tar }
      - run: tar -xf nx.tar -C ~ || true
      - uses: eas/install_node_modules
      - run: tar -cf nx.tar -C ~ .nx
      - uses: eas/save_cache
        if: ${{ github.ref_type != 'tag' }}
        with: { key: "nx-android-e2e-${{ github.sha }}", path: nx.tar }
      - name: exa setup # cspell:ignore sysctl
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
          flock /tmp/apt.lock pnpm nx e2e server > server.log 2>&1 &
      - uses: eas/restore_cache
        id: maestro
        with:
          key: "maestro-${{ hashFiles('.maestro/package.json', '.maestro/patches/*.patch') }}"
          path: .maestro/build
      - run: GRADLE_USER_HOME=$(mktemp -d) pnpm nx maestro e2e && set-env PATH "$PWD/.maestro/build/bin:$PATH"
      - uses: eas/save_cache
        if: ${{ steps.maestro.outputs.cache_hit != 'true' }}
        with:
          key: "maestro-${{ hashFiles('.maestro/package.json', '.maestro/patches/*.patch') }}"
          path: .maestro/build
      - uses: eas/download_build
        id: download
        with: { build_id: "${{ after.android_get.outputs.build_id || after.android_build.outputs.build_id }}" }
      - uses: eas/repack
        id: repack
        with: { platform: android, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - name: prepare device # cspell:ignore getprop logcat
        run: |
          adb wait-for-device
          timeout 180 adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb root
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb reverse tcp:443 tcp:443 && adb reverse tcp:3000 tcp:3000 && adb reverse tcp:8545 tcp:8545 && adb reverse tcp:8969 tcp:8969
          adb install "${{ steps.repack.outputs.output_path }}"
          adb logcat -v time > emulator.log 2>&1 &
          for i in {1..420}; do
            curl -f http://localhost:3000/api/auth/authentication > /dev/null 2>&1 && break
            [ $i -eq 420 ] && echo "health check timed out" && cat server.log && exit 1
            sleep 1
          done
      - name: trust local server # cspell:ignore cacerts chcon conscrypt noout nsenter pidof servername zygote
        run: |
          { openssl s_client -connect 127.0.0.1:443 -servername "$APP_DOMAIN" < /dev/null 2> /dev/null || true; } | openssl x509 > cert.pem
          adb push cert.pem "/data/local/tmp/$(openssl x509 -subject_hash_old -noout -in cert.pem).0"
          adb shell "domain=$APP_DOMAIN sh -s" << 'EOF'
          set -e
          mkdir /data/local/tmp/cacerts
          cp /apex/com.android.conscrypt/cacerts/* /data/local/tmp/*.0 /data/local/tmp/cacerts
          { cat /system/etc/hosts; echo "127.0.0.1 $domain"; } > /data/local/tmp/hosts
          chmod -R a+rX /data/local/tmp/cacerts /data/local/tmp/hosts
          chcon -R u:object_r:system_file:s0 /data/local/tmp/cacerts /data/local/tmp/hosts
          for pid in 1 $(pidof zygote zygote64); do
            nsenter --mount=/proc/$pid/ns/mnt -- mount --bind /data/local/tmp/cacerts /apex/com.android.conscrypt/cacerts
            nsenter --mount=/proc/$pid/ns/mnt -- mount --bind /data/local/tmp/hosts /system/etc/hosts
          done
          EOF
      - run: pnpm e2e:maestro --format junit --output .maestro/junit.xml
      - name: exa teardown
        if: always()
        run: | # cspell:ignore pkill
          curl -X POST http://localhost:3000/e2e/shutdown || true
          for i in {1..60}; do [ -f server/coverage/lcov.info ] && break; sleep 1; done
          curl -Os https://cli.codecov.io/latest/linux/codecov && chmod +x codecov
          ./codecov upload-coverage --disable-search -f server/coverage/lcov.info -f server/coverage/app.json -F android -n android --build-url ${{ workflow.url }} --git-service github
          ./codecov do-upload --report-type test_results --disable-search -f .maestro/junit.xml -F android -n android --build-url ${{ workflow.url }} --git-service github
          pkill -f "adb logcat" || true
      - uses: eas/upload_artifact
        if: always()
        with:
          type: other
          ignore_error: true
          path: |
            apt.log
            server.log
            server/coverage
            server/node_modules/@exactly/.*
            emulator.log
            emulator-process.log
            ${{ env.HOME }}/.maestro/tests
            .maestro/screenshots

  ios_get:
    if: ${{ github.ref_type != 'tag' }}
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: e2e:production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  ios_build:
    type: build
    needs: [fingerprint]
    after: [ios_get]
    if: ${{ !after.ios_get.outputs.build_id }}
    image: sdk-55
    env: { APP_DOMAIN: sandbox.exactly.app, APPLE_TEAM_ID: 665NDX7LBZ }
    params: { platform: ios, profile: e2e:production }

  ios_e2e:
    after: [ios_get, ios_build]
    if: ${{ after.ios_get.outputs.build_id || after.ios_build.status == 'success' }}
    environment: development
    runs_on: macos-large
    image: macos-tahoe-26.5-xcode-26.6
    env:
      APP_DOMAIN: sandbox.exactly.app
      CHAIN_ID: "31337"
      EXPO_PUBLIC_ENV: e2e
      GIT_BRANCH: "${{ github.ref_name }}"
      REDISMS_SYSTEM_BINARY: /opt/homebrew/bin/redis-server
    steps:
      - run: brew install redis
      - uses: eas/checkout
      - uses: eas/restore_cache
        if: ${{ github.ref_type != 'tag' }}
        with: { key: "nx-ios-e2e-${{ github.sha }}", restore_keys: nx-ios-e2e-, path: nx.tar }
      - run: tar -xf nx.tar -C ~ || true
      - uses: eas/install_node_modules
      - run: tar -cf nx.tar -C ~ .nx
      - uses: eas/save_cache
        if: ${{ github.ref_type != 'tag' }}
        with: { key: "nx-ios-e2e-${{ github.sha }}", path: nx.tar }
      - name: exa setup
        run: pnpm nx e2e server > server.log 2>&1 &
      - uses: eas/restore_cache
        id: maestro
        with:
          key: "maestro-${{ hashFiles('.maestro/package.json', '.maestro/patches/*.patch') }}"
          path: .maestro/build
      - run: GRADLE_USER_HOME=$(mktemp -d) pnpm nx maestro e2e && set-env PATH "$PWD/.maestro/build/bin:$PATH"
      - uses: eas/save_cache
        if: ${{ steps.maestro.outputs.cache_hit != 'true' }}
        with:
          key: "maestro-${{ hashFiles('.maestro/package.json', '.maestro/patches/*.patch') }}"
          path: .maestro/build
      - uses: eas/download_build
        id: download
        with: { build_id: "${{ after.ios_get.outputs.build_id || after.ios_build.outputs.build_id }}" }
      - uses: eas/repack
        id: repack
        with: { platform: ios, source_app_path: "${{ steps.download.outputs.artifact_path }}" }
      - uses: eas/start_ios_simulator
      - name: prepare device # cspell:ignore servername
        run: |
          printf '%s\n' "127.0.0.1 $APP_DOMAIN" "::1 $APP_DOMAIN" | sudo tee -a /etc/hosts
          xcrun simctl spawn booted defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
          xcrun simctl install booted "${{ steps.repack.outputs.output_path }}"
          xcrun simctl spawn booted log stream --predicate 'subsystem contains "app.exactly" or process == "Exa"' > simulator.log 2>&1 &
          for i in {1..420}; do
            curl -f http://localhost:3000/api/auth/authentication > /dev/null 2>&1 && break
            [ $i -eq 420 ] && echo "health check timed out" && cat server.log && exit 1
            sleep 1
          done
          { openssl s_client -connect "$APP_DOMAIN:443" -servername "$APP_DOMAIN" < /dev/null 2> /dev/null || true; } | openssl x509 > cert.pem
          xcrun simctl keychain booted add-root-cert cert.pem
      - run: pnpm e2e:maestro --format junit --output .maestro/junit.xml
      - name: exa teardown
        if: always()
        run: | # cspell:ignore pkill
          curl -X POST http://localhost:3000/e2e/shutdown || true
          for i in {1..60}; do [ -f server/coverage/lcov.info ] && break; sleep 1; done
          curl -Os https://cli.codecov.io/latest/macos/codecov && chmod +x codecov
          ./codecov upload-coverage --disable-search -f server/coverage/lcov.info -f server/coverage/app.json -F ios -n ios --build-url ${{ workflow.url }} --git-service github
          ./codecov do-upload --report-type test_results --disable-search -f .maestro/junit.xml -F ios -n ios --build-url ${{ workflow.url }} --git-service github
          pkill -f "log stream" || true
          xcrun simctl diagnose -b --no-archive --output=simulator-diagnose || true
      - uses: eas/upload_artifact
        if: always()
        with:
          type: other
          ignore_error: true
          path: |
            server.log
            server/coverage
            server/node_modules/@exactly/.*
            simulator.log
            simulator-diagnose
            ${{ env.HOME }}/.maestro/tests
            .maestro/screenshots
